  const nextFrame = fn => requestAnimationFrame(() => requestAnimationFrame(fn));

  /** XSS'e karşı tüm dinamik metinler bu fonksiyondan geçer */
  const escapeHTML = v => String(v).replace(/[&<>"']/g, ch => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
  ));

  const randInt = max => {
    try {
      if (window.crypto && window.crypto.getRandomValues) {
        const a = new Uint32Array(1);
        window.crypto.getRandomValues(a);
        return a[0] % max;
      }
    } catch (e) { /* Math.random'a düş */ }
    return Math.floor(Math.random() * max);
  };
  const shuffle = arr => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = randInt(i + 1);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  const reduceMQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  const prefersReducedMotion = () => !!(reduceMQ && reduceMQ.matches);
  const finePointer = () => !!(window.matchMedia && window.matchMedia('(pointer: fine)').matches);

  /* Sayı biçimlendiriciler (tr-TR: binlik ".", ondalık ",") */
  const NF_DEC = new Intl.NumberFormat('tr-TR', { maximumFractionDigits: 3 });
  const NF_INT = new Intl.NumberFormat('tr-TR', { maximumFractionDigits: 0 });
  const NF_PCT = new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const NF_2 = new Intl.NumberFormat('tr-TR', { maximumFractionDigits: 2 });
  const fmtInt = v => NF_INT.format(Math.round(v || 0));
  const fmtPct = v => '%' + NF_PCT.format(v || 0);
  const fmtValue = (q, v) => (q.year ? String(Math.round(v)) : NF_DEC.format(v));
  const fmtWithUnit = (q, v) => {
    const s = fmtValue(q, v);
    if (q.year) return s;
    return q.unit ? `${s} ${q.unit}` : s;
  };
  const fmtDiff = (q, diff) => {
    if (diff === 0) return 'Fark yok';
    const unit = q.year ? 'yıl' : q.unit;
    const abs = q.year ? String(Math.round(Math.abs(diff))) : NF_DEC.format(Math.abs(diff));
    return `${diff > 0 ? '+' : '−'}${abs}${unit ? ' ' + unit : ''}`;
  };
  /** Büyük sayılar için okunabilir ipucu: 86000000000 → "≈ 86 milyar" */
  const humanize = v => {
    const a = Math.abs(v);
    const units = [[1e12, 'trilyon'], [1e9, 'milyar'], [1e6, 'milyon']];
    for (const [d, n] of units) if (a >= d) return `≈ ${NF_2.format(v / d)} ${n}`;
    return '';
  };
  const hexA = (hex, a) => {
    const h = hex.replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
    return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
  };

  /* ======================================================================
     3. ZAMAN SERVİSİ — tüm günlük hesaplar Europe/Istanbul saatine göre
     ====================================================================== */
  const TimeService = (() => {
    let dtf = null;
    try {
      dtf = new Intl.DateTimeFormat('en-GB', {
        timeZone: CONFIG.TIMEZONE, year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
      });
    } catch (e) { dtf = null; }

    const pad = n => String(n).padStart(2, '0');

    /** İstanbul saatine göre tarih/saat bileşenleri */
    function parts(date = new Date()) {
      if (dtf && dtf.formatToParts) {
        try {
          const o = {};
          dtf.formatToParts(date).forEach(p => { o[p.type] = p.value; });
          const h = Number(o.hour) % 24;
          const res = { y: +o.year, m: +o.month, d: +o.day, h, mi: +o.minute, s: +o.second };
          if (Object.values(res).every(Number.isFinite)) return res;
        } catch (e) { /* yedeğe düş */ }
      }
      const t = new Date(date.getTime() + CONFIG.TZ_FALLBACK_OFFSET_H * 3600e3);
      return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate(), h: t.getUTCHours(), mi: t.getUTCMinutes(), s: t.getUTCSeconds() };
    }
    const today = () => { const p = parts(); return `${p.y}-${pad(p.m)}-${pad(p.d)}`; };
    const msUntilMidnight = () => {
      const p = parts();
      const sec = p.h * 3600 + p.mi * 60 + p.s;
      return Math.max(0, (86400 - sec) * 1000 - new Date().getMilliseconds());
    };
    const isISO = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
    const addDays = (iso, n) => {
      const d = new Date(iso + 'T12:00:00Z');
      d.setUTCDate(d.getUTCDate() + n);
      return d.toISOString().slice(0, 10);
    };
    const format = (iso, opts) => {
      try {
        return new Intl.DateTimeFormat('tr-TR', Object.assign({ timeZone: 'UTC' }, opts)).format(new Date(iso + 'T12:00:00Z'));
      } catch (e) { return iso; }
    };
    const longDate = iso => format(iso, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const shortDate = iso => format(iso, { day: 'numeric', month: 'short' });
    const countdown = ms => {
      const t = Math.floor(ms / 1000);
      return `${pad(Math.floor(t / 3600))}:${pad(Math.floor((t % 3600) / 60))}:${pad(t % 60)}`;
    };
    const hour = () => parts().h;
    return { today, hour, msUntilMidnight, isISO, addDays, longDate, shortDate, countdown };
  })();

  /* ======================================================================
     4. SORU DEPOSU
     Şimdilik yerleşik veriden okur. İleride bir API'den yüklemek için
     yalnızca bu modülün içi değiştirilir (ör. fetch('/api/questions')).
     ====================================================================== */
  const QuestionRepository = (() => {
    const list = [];
    const map = new Map();

    function normalize(category, row) {
      const [id, text, answer, unit, min, max, info, opts] = row;
      const o = opts || {};
      let lo = isNum(min) ? min : answer;
      let hi = isNum(max) ? max : answer;
      if (lo > hi) [lo, hi] = [hi, lo];
      lo = Math.min(lo, answer);
      hi = Math.max(hi, answer);
      return Object.freeze({
        id, text, category, answer,
        unit: unit || '',
        min: lo, max: hi,
        info: info || '',
        year: !!o.year,
        scale: isNum(o.scale) && o.scale > 0 ? o.scale : null
      });
    }

    Object.keys(QUESTION_DATA).forEach(cat => {
      if (!CAT_MAP.has(cat)) return;
      QUESTION_DATA[cat].forEach(row => {
        try {
          const q = normalize(cat, row);
          if (typeof q.id !== 'string' || !q.id || map.has(q.id) || !isNum(q.answer) || q.answer < 0 || !q.text) {
            console.warn('[Adivinar] Geçersiz veya tekrarlı soru atlandı:', row && row[0]);
            return;
          }
          map.set(q.id, q);
          list.push(q);
        } catch (e) {
          console.warn('[Adivinar] Soru okunamadı:', e);
        }
      });
    });

    return {
      all: () => list,
      get: id => map.get(id) || null,
      has: id => map.has(id),
      byCategory: cat => (cat === MIXED ? list : list.filter(q => q.category === cat)),
      count: cat => (cat === MIXED ? list.length : list.filter(q => q.category === cat).length)
    };
  })();

  /* ======================================================================
     5. VERİ KATMANI
     StorageAdapter, kalıcı depolamayı soyutlar. Cihazlar arası senkron için
     aynı arayüze sahip bir RemoteAdapter (read/write) yazılıp burada
     değiştirilmesi yeterlidir; oyun mantığı Store üzerinden çalışır.
     ====================================================================== */
  const StorageAdapter = {
    read(key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } },
    write(key, value) { try { window.localStorage.setItem(key, value); return true; } catch (e) { return false; } },
    remove(key) { try { window.localStorage.removeItem(key); } catch (e) { /* yok say */ } },
    available() {
      try {
        const k = '__ta_probe__';
        window.localStorage.setItem(k, '1');
        window.localStorage.removeItem(k);
        return true;
      } catch (e) { return false; }
    }
  };

  const Store = (() => {
    let state = null;
    let saveWarned = false;
    const meta = { corrupted: false };

    function defaults() {
      return {
        version: CONFIG.DATA_VERSION,
        createdAt: Date.now(),
        daily: {
          date: '',
          questions: [],          // bugünün soru ID'leri (en fazla 50)
          currentIndex: 0,
          usedQuestionIds: [],    // günlük modda GÖSTERİLMİŞ tüm ID'ler (kalıcı geçmiş)
          answers: [],
          totalScore: 0,
          completedAt: null
        },
        unlimited: {
          usedQuestionIds: [],    // sınırsız modda gösterilmiş ID'ler (günlükten bağımsız)
          totalQuestions: 0,
          totalScore: 0,
          bestSessionScore: 0,
          sessionsPlayed: 0,
          session: null
        },
        statistics: {
          totalQuestions: 0,
          totalScore: 0,
          accuracySum: 0,
          averageAccuracy: 0,
          bestScore: 0,
          exactHits: 0,
          categories: {},
          levels: {},
          days: {}
        },
        multiplayer: {
          roster: PLAYER_COLORS.slice(0, CONFIG.MP_MAX).map((c, i) => ({ name: `Oyuncu ${i + 1}`, color: c.key })),
          count: 2,
          settings: { rounds: 10, category: MIXED, hide: false },
          usedQuestionIds: [],
          matchesPlayed: 0,
          match: null
        }
      };
    }

    /* --- Doğrulama yardımcıları --- */
    const num = (v, def = 0) => (isNum(v) && v >= 0 ? v : def);
    const ids = v => (Array.isArray(v)
      ? Array.from(new Set(v.filter(x => typeof x === 'string' && QuestionRepository.has(x))))
      : []);
    const validAnswer = a => a && typeof a === 'object' && typeof a.id === 'string' &&
      QuestionRepository.has(a.id) && isNum(a.guess) && a.guess >= 0 && isNum(a.accuracy) && isNum(a.score);
    const cleanAnswer = a => {
      const q = QuestionRepository.get(a.id);
      return {
        id: a.id,
        category: q.category,
        guess: a.guess,
        answer: q.answer,
        accuracy: clamp(a.accuracy, 0, 100),
        score: clamp(Math.round(a.score), 0, 1000),
        diff: Math.round((a.guess - q.answer) * 1000) / 1000,
        exact: !!a.exact,
        ts: num(a.ts, Date.now())
      };
    };

    /** Bozuk/eksik veriyi güvenli varsayılanlarla birleştirir */
    function sanitize(raw) {
      const d = defaults();
      if (!raw || typeof raw !== 'object') return d;
      d.createdAt = num(raw.createdAt, Date.now());

      // Günlük
      const rd = raw.daily && typeof raw.daily === 'object' ? raw.daily : {};
      d.daily.usedQuestionIds = ids(rd.usedQuestionIds);
      if (TimeService.isISO(rd.date)) {
        const qs = ids(rd.questions).slice(0, CONFIG.DAILY_LIMIT);
        const answers = Array.isArray(rd.answers) ? rd.answers.filter(validAnswer).map(cleanAnswer) : [];
        const ordered = [];
        for (let i = 0; i < answers.length && i < qs.length; i++) {
          if (answers[i].id === qs[i]) ordered.push(answers[i]); else break;
        }
        d.daily.date = rd.date;
        d.daily.questions = qs;
        d.daily.answers = ordered;
        d.daily.totalScore = ordered.reduce((s, a) => s + a.score, 0);
        const ci = Number.isInteger(rd.currentIndex) ? rd.currentIndex : ordered.length;
        d.daily.currentIndex = clamp(ci, Math.max(0, ordered.length - 1), ordered.length);
        d.daily.completedAt = isNum(rd.completedAt) ? rd.completedAt : null;
        // Bugünün havuzundaki gösterilmiş sorular geçmişte de olmalı
        qs.slice(0, d.daily.currentIndex + 1).forEach(id => {
          if (!d.daily.usedQuestionIds.includes(id)) d.daily.usedQuestionIds.push(id);
        });
      }

      // Sınırsız
      const ru = raw.unlimited && typeof raw.unlimited === 'object' ? raw.unlimited : {};
      d.unlimited.usedQuestionIds = ids(ru.usedQuestionIds);
      d.unlimited.totalQuestions = num(ru.totalQuestions);
      d.unlimited.totalScore = num(ru.totalScore);
      d.unlimited.bestSessionScore = num(ru.bestSessionScore);
      d.unlimited.sessionsPlayed = num(ru.sessionsPlayed);
      const s = ru.session;
      if (s && typeof s === 'object' && (s.category === MIXED || CAT_MAP.has(s.category))) {
        const answers = Array.isArray(s.answers) ? s.answers.filter(validAnswer).map(cleanAnswer) : [];
        const currentId = typeof s.currentId === 'string' && QuestionRepository.has(s.currentId) ? s.currentId : null;
        const seenIds = ids(s.seenIds);
        if (currentId && !seenIds.includes(currentId)) seenIds.push(currentId);
        const last = answers[answers.length - 1];
        d.unlimited.session = {
          category: s.category,
          currentId,
          answered: !!(currentId && last && last.id === currentId && s.answered),
          answers,
          score: answers.reduce((acc, a) => acc + a.score, 0),
          seenIds,
          prevBest: num(s.prevBest),
          startedAt: num(s.startedAt, Date.now())
        };
      }

      // İstatistikler
      const rs = raw.statistics && typeof raw.statistics === 'object' ? raw.statistics : {};
      const st = d.statistics;
      st.totalQuestions = num(rs.totalQuestions);
      st.totalScore = num(rs.totalScore);
      st.accuracySum = num(rs.accuracySum);
      st.bestScore = num(rs.bestScore);
      st.exactHits = num(rs.exactHits);
      st.averageAccuracy = st.totalQuestions ? clamp(st.accuracySum / st.totalQuestions, 0, 100) : 0;
      if (rs.categories && typeof rs.categories === 'object') {
        CATEGORIES.forEach(c => {
          const v = rs.categories[c.key];
          if (v && isNum(v.count) && v.count > 0) {
            st.categories[c.key] = { count: num(v.count), accuracySum: num(v.accuracySum), score: num(v.score) };
          }
        });
      }
      if (rs.levels && typeof rs.levels === 'object') {
        LEVELS.forEach(l => { if (isNum(rs.levels[l.key])) st.levels[l.key] = num(rs.levels[l.key]); });
      }
      if (rs.days && typeof rs.days === 'object') {
        Object.keys(rs.days).filter(TimeService.isISO).sort().slice(-CONFIG.DAY_HISTORY_LIMIT).forEach(k => {
          const v = rs.days[k];
          if (v && isNum(v.count)) st.days[k] = { count: num(v.count), score: num(v.score), accuracySum: num(v.accuracySum) };
        });
      }

      // Çok oyunculu
      const rm = raw.multiplayer && typeof raw.multiplayer === 'object' ? raw.multiplayer : {};
      const mp = d.multiplayer;
      if (Array.isArray(rm.roster)) {
        mp.roster.forEach((p, i) => {
          const r = rm.roster[i];
          if (!r || typeof r !== 'object') return;
          if (typeof r.name === 'string') p.name = cleanName(r.name);
          if (PLAYER_COLOR_MAP.has(r.color)) p.color = r.color;
        });
        // Renkler benzersiz olmalı
        const seen = new Set();
        mp.roster.forEach(p => {
          if (seen.has(p.color)) p.color = PLAYER_COLORS.find(c => !seen.has(c.key)).key;
          seen.add(p.color);
        });
      }
      if (Number.isInteger(rm.count)) mp.count = clamp(rm.count, CONFIG.MP_MIN, CONFIG.MP_MAX);
      const rset = rm.settings && typeof rm.settings === 'object' ? rm.settings : {};
      if (CONFIG.MP_ROUND_OPTIONS.includes(rset.rounds)) mp.settings.rounds = rset.rounds;
      if (rset.category === MIXED || CAT_MAP.has(rset.category)) mp.settings.category = rset.category;
      mp.settings.hide = !!rset.hide;
      mp.usedQuestionIds = ids(rm.usedQuestionIds);
      mp.matchesPlayed = num(rm.matchesPlayed);
      const mm = rm.match;
      if (mm && typeof mm === 'object' && Array.isArray(mm.players)) {
        const players = mm.players.slice(0, CONFIG.MP_MAX)
          .filter(p => p && typeof p === 'object')
          .map((p, i) => ({ name: cleanName(p.name) || `Oyuncu ${i + 1}`, color: PLAYER_COLOR_MAP.has(p.color) ? p.color : PLAYER_COLORS[i].key }));
        const qids = ids(mm.questionIds);
        if (players.length >= CONFIG.MP_MIN && qids.length) {
          const history = [];
          (Array.isArray(mm.history) ? mm.history : []).some((h, i) => {
            const ok = h && h.qid === qids[i] && Array.isArray(h.guesses) && h.guesses.length === players.length && h.guesses.every(g => isNum(g) && g >= 0);
            if (ok) history.push({ qid: h.qid, guesses: h.guesses.slice() });
            return !ok;
          });
          const idx = Number.isInteger(mm.index) ? mm.index : history.length;
          mp.match = {
            players,
            category: mm.category === MIXED || CAT_MAP.has(mm.category) ? mm.category : MIXED,
            hide: !!mm.hide,
            questionIds: qids,
            index: clamp(idx, Math.max(0, history.length - 1), history.length),
            history,
            startedAt: num(mm.startedAt, Date.now())
          };
        }
      }
      return d;
    }

    /** Gelecekteki veri sürümleri için göç noktası */
    function migrate(raw) {
      if (!raw || typeof raw !== 'object') throw new Error('Geçersiz veri');
      if (raw.version !== CONFIG.DATA_VERSION) {
        // v1 tek sürüm; bilinmeyen sürüm eskiyse alanlar sanitize ile kurtarılır.
        if (isNum(raw.version) && raw.version > CONFIG.DATA_VERSION) throw new Error('Desteklenmeyen sürüm');
      }
      return sanitize(raw);
    }

    function load() {
      meta.corrupted = false;
      let txt = StorageAdapter.read(CONFIG.STORAGE_KEY);
      if (!txt) {
        // Eski anahtardan tek seferlik taşıma
        for (const k of CONFIG.LEGACY_KEYS) {
          const legacy = StorageAdapter.read(k);
          if (legacy) { txt = legacy; StorageAdapter.write(CONFIG.STORAGE_KEY, legacy); StorageAdapter.remove(k); break; }
        }
      }
      if (!txt) { state = defaults(); return state; }
      try {
        state = migrate(JSON.parse(txt));
      } catch (e) {
        console.warn('[Adivinar] Kayıt okunamadı, varsayılanlar kullanılıyor.', e);
        StorageAdapter.write(CONFIG.BACKUP_KEY, txt);
        meta.corrupted = true;
        state = defaults();
        save();
      }
      return state;
    }

    function save() {
      let ok = false;
      try { ok = StorageAdapter.write(CONFIG.STORAGE_KEY, JSON.stringify(state)); } catch (e) { ok = false; }
      if (!ok && !saveWarned) {
        saveWarned = true;
        Toast.show('İlerleme kaydedilemedi. Tarayıcı depolaması kapalı veya dolu olabilir.', 'error', 6000);
      }
      return ok;
    }

    function reset() { state = defaults(); save(); return state; }

    return { load, save, reset, get: () => state, meta };
  })();

  /* ======================================================================
     6. OYUN MOTORU — yakınlık ve puan
       hataOrani = |tahmin − kabulAralığı| / payda
       payda     = soru.scale || max(|doğruCevap|, 1)
       yakinlik  = max(0, 100 × (1 − hataOrani))
       puan      = round(yakinlik × 10)
     Kabul aralığının içindeki tahminlerde mesafe 0'dır (tam isabet).
     ====================================================================== */
  const GameEngine = {
    evaluate(q, guess) {
      let distance = 0;
      if (guess < q.min) distance = q.min - guess;
      else if (guess > q.max) distance = guess - q.max;
      const base = q.scale || Math.max(Math.abs(q.answer), 1);
      const errorRate = distance / base;
      const raw = clamp(100 * (1 - errorRate), 0, 100);
      return {
        id: q.id,
        category: q.category,
        guess,
        answer: q.answer,
        accuracy: Math.round(raw * 10) / 10,
        score: Math.round(raw * 10),
        diff: Math.round((guess - q.answer) * 1000) / 1000,
        exact: distance === 0,
        ts: Date.now()
      };
    },
    level(acc) { return LEVELS.find(l => acc >= l.min) || LEVELS[LEVELS.length - 1]; }
  };

  /* ======================================================================
     7. İSTATİSTİK SERVİSİ
     ====================================================================== */
  const Stats = {
    /** Her cevap (her iki mod) gerçek veriden istatistiklere işlenir */
    record(rec) {
      const st = Store.get().statistics;
      st.totalQuestions += 1;
      st.totalScore += rec.score;
      st.accuracySum += rec.accuracy;
      if (rec.exact) st.exactHits += 1;
      st.averageAccuracy = st.accuracySum / st.totalQuestions;

      const c = st.categories[rec.category] || (st.categories[rec.category] = { count: 0, accuracySum: 0, score: 0 });
      c.count += 1; c.accuracySum += rec.accuracy; c.score += rec.score;

      const lv = GameEngine.level(rec.accuracy).key;
      st.levels[lv] = (st.levels[lv] || 0) + 1;

      const day = TimeService.today();
      const dd = st.days[day] || (st.days[day] = { count: 0, score: 0, accuracySum: 0 });
      dd.count += 1; dd.score += rec.score; dd.accuracySum += rec.accuracy;

      const keys = Object.keys(st.days).sort();
      while (keys.length > CONFIG.DAY_HISTORY_LIMIT) delete st.days[keys.shift()];
    },
    updateBest(score) {
      const st = Store.get().statistics;
      if (score > st.bestScore) { st.bestScore = score; return true; }
      return false;
    },
    /** Bugünden (veya dünden) geriye kesintisiz oynanan gün sayısı */
    streak() {
      const days = Store.get().statistics.days;
      let d = TimeService.today();
      if (!days[d]) d = TimeService.addDays(d, -1);
      let n = 0;
      while (days[d] && days[d].count > 0 && n < 400) { n++; d = TimeService.addDays(d, -1); }
      return n;
    },
    /** Bir cevap listesinden performans özeti */
    summarize(answers) {
      const list = answers || [];
      const n = list.length;
      const total = list.reduce((s, a) => s + a.score, 0);
      const avg = n ? list.reduce((s, a) => s + a.accuracy, 0) / n : 0;
      const exact = list.filter(a => a.exact).length;
      let best = null; let worst = null;
      list.forEach(a => {
        if (!best || a.accuracy > best.accuracy) best = a;
        if (!worst || a.accuracy < worst.accuracy) worst = a;
      });
      const catMap = new Map();
      list.forEach(a => {
        const c = catMap.get(a.category) || { key: a.category, count: 0, accSum: 0, score: 0 };
        c.count++; c.accSum += a.accuracy; c.score += a.score;
        catMap.set(a.category, c);
      });
      const cats = Array.from(catMap.values())
        .map(c => Object.assign(c, { avg: c.accSum / c.count }))
        .sort((x, y) => y.avg - x.avg || y.count - x.count);
      return { count: n, total, avg, exact, best, worst, cats, bestCat: cats[0] || null, answers: list.slice() };
    }
  };

  /* ======================================================================
     8. GÜNLÜK MOD
     - Her takvim günü (İstanbul) için en fazla 50 soruluk havuz oluşturulur.
     - Havuz, daha önce günlük modda GÖSTERİLMİŞ ID'ler filtrelenerek seçilir.
     - Soru ekrana geldiği anda kullanılmış sayılır (markShown).
     ====================================================================== */
  const Daily = {
    ensure() {
      const st = Store.get();
      const today = TimeService.today();
      if (st.daily.date !== today) this.createPool(today);
      return st.daily;
    },
    createPool(date) {
      const st = Store.get();
      const used = new Set(st.daily.usedQuestionIds);
      const available = QuestionRepository.all().filter(q => !used.has(q.id));
      // Kategori dengeli seçim: her kategoriden sırayla soru alınır
      const buckets = new Map();
      shuffle(available).forEach(q => {
        if (!buckets.has(q.category)) buckets.set(q.category, []);
        buckets.get(q.category).push(q.id);
      });
      const order = shuffle(Array.from(buckets.keys()));
      const picked = [];
      while (picked.length < CONFIG.DAILY_LIMIT) {
        let added = false;
        for (const k of order) {
          const b = buckets.get(k);
          if (b.length && picked.length < CONFIG.DAILY_LIMIT) { picked.push(b.pop()); added = true; }
        }
        if (!added) break;
      }
      st.daily = {
        date,
        questions: shuffle(picked),
        currentIndex: 0,
        usedQuestionIds: st.daily.usedQuestionIds,
        answers: [],
        totalScore: 0,
        completedAt: null
      };
      Store.save();
    },
    status() {
      const d = this.ensure();
      if (!d.questions.length) return 'exhausted';
      if (d.currentIndex >= d.questions.length) return 'complete';
      return 'playing';
    },
    current() {
      const d = this.ensure();
      return QuestionRepository.get(d.questions[d.currentIndex]);
    },
    currentAnswer() {
      const d = Store.get().daily;
      return d.answers.length > d.currentIndex ? d.answers[d.currentIndex] : null;
    },
    markShown(id) {
      const d = Store.get().daily;
      if (id && !d.usedQuestionIds.includes(id)) { d.usedQuestionIds.push(id); Store.save(); }
    },
    submit(guess) {
      const d = this.ensure();
      if (this.currentAnswer()) return null;
      const q = this.current();
      if (!q) return null;
      const rec = GameEngine.evaluate(q, guess);
      d.answers.push(rec);
      d.totalScore += rec.score;
      Stats.record(rec);
      Stats.updateBest(d.totalScore);
      Store.save();
      return rec;
    },
    next() {
      const d = this.ensure();
      if (!this.currentAnswer()) return false;   // Cevapsız geçiş yok
      d.currentIndex = Math.min(d.currentIndex + 1, d.questions.length);
      if (d.currentIndex >= d.questions.length && !d.completedAt) d.completedAt = Date.now();
      Store.save();
      return true;
    },
    unseenCount() {
      const used = new Set(Store.get().daily.usedQuestionIds);
      return QuestionRepository.all().filter(q => !used.has(q.id)).length;
    },
    avgAccuracy() {
      const a = Store.get().daily.answers;
      return a.length ? a.reduce((s, x) => s + x.accuracy, 0) / a.length : 0;
    }
  };

  /* ======================================================================
     9. SINIRSIZ MOD — günlük havuzdan tamamen bağımsız seçim
     ====================================================================== */
  const Unlimited = {
    session() { return Store.get().unlimited.session; },
    start(category) {
      const u = Store.get().unlimited;
      u.session = {
        category, currentId: null, answered: false, answers: [], score: 0,
        seenIds: [], prevBest: u.bestSessionScore, startedAt: Date.now()
      };
      const ok = this.pickNext();
      Store.save();
      return ok;
    },
    /** Oturumda görülmemiş, mümkünse geçmişte de görülmemiş rastgele soru seçer */
    pickNext() {
      const u = Store.get().unlimited;
      const s = u.session;
      if (!s) return { ok: false };
      const seen = new Set(s.seenIds);
      const candidates = QuestionRepository.byCategory(s.category).filter(q => !seen.has(q.id));
      if (!candidates.length) { s.currentId = null; s.answered = false; return { ok: false }; }
      const used = new Set(u.usedQuestionIds);
      let fresh = candidates.filter(q => !used.has(q.id));
      let recycled = false;
      if (!fresh.length) {
        // Tüm sorular geçmişte görüldü: bu kategorinin geçmişini temizle (oturum tekrarı yine engelli)
        const cids = new Set(candidates.map(q => q.id));
        u.usedQuestionIds = u.usedQuestionIds.filter(id => !cids.has(id));
        fresh = candidates;
        recycled = true;
      }
      const q = fresh[randInt(fresh.length)];
      s.currentId = q.id;
      s.answered = false;
      s.seenIds.push(q.id);
      if (!u.usedQuestionIds.includes(q.id)) u.usedQuestionIds.push(q.id);
      return { ok: true, recycled };
    },
    current() {
      const s = this.session();
      return s && s.currentId ? QuestionRepository.get(s.currentId) : null;
    },
    currentAnswer() {
      const s = this.session();
      return s && s.answered ? s.answers[s.answers.length - 1] : null;
    },
    submit(guess) {
      const u = Store.get().unlimited;
      const s = u.session;
      if (!s || s.answered || !s.currentId) return null;
      const q = QuestionRepository.get(s.currentId);
      if (!q) return null;
      const rec = GameEngine.evaluate(q, guess);
      s.answers.push(rec);
      s.score += rec.score;
      s.answered = true;
      u.totalQuestions += 1;
      u.totalScore += rec.score;
      if (s.score > u.bestSessionScore) u.bestSessionScore = s.score;
      Stats.record(rec);
      Stats.updateBest(s.score);
      Store.save();
      return rec;
    },
    next() {
      const s = this.session();
      if (!s) return { ok: false, reason: 'none' };
      if (!s.answered) return { ok: false, reason: 'unanswered' };
      const r = this.pickNext();
      Store.save();
      return r.ok ? r : { ok: false, reason: 'exhausted' };
    },
    finish() {
      const u = Store.get().unlimited;
      const s = u.session;
      if (!s) return null;
      const summary = Stats.summarize(s.answers);
      summary.newRecord = s.score > s.prevBest && s.score > 0;
      summary.category = s.category;
      if (s.answers.length) u.sessionsPlayed += 1;
      u.session = null;
      Store.save();
      return summary;
    },
    avgAccuracy() {
      const s = this.session();
      return s && s.answers.length ? s.answers.reduce((a, x) => a + x.accuracy, 0) / s.answers.length : 0;
    }
  };

  /* ======================================================================
     9b. ONLINE ÇOK OYUNCULU — PeerJS (WebRTC) ile oda kodu sistemi
     ----------------------------------------------------------------------
     - Odayı kuran tarayıcı (host) maçın tek otoritesidir: soruları seçer,
       tahminleri toplar, puanlar ve oda durumunu herkese yayınlar.
     - Tahminler tur açıklanana kadar yalnızca host'ta tutulur; diğer
       oyunculara sadece "cevapladı" bilgisi gider (kopya engeli).
     - Tüm oyuncular aynı soru bankasına sahip olduğundan ağda yalnızca
       soru ID'leri dolaşır.
     - Host sayfayı yenilerse oda yerel kayıttan yeniden açılabilir;
       misafirler otomatik olarak yeniden bağlanır.
     ====================================================================== */
  const NET = Object.freeze({
    VERSION: 1,
    ID_PREFIX: 'adivinar-v1-',
    CODE_ALPHABET: 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789',
    CODE_LENGTH: 5,
    LIBS: [
      'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
      'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js'
    ],
    JOIN_TIMEOUT_MS: 15000,
    RECONNECT_TRIES: 12,
    RECONNECT_DELAY_MS: 3000,
    HOST_KEY: 'adivinar.onlineHost',
    GUEST_KEY: 'adivinar.onlineGuest',
    CLIENT_KEY: 'adivinar.clientId',
    SNAPSHOT_TTL_MS: 6 * 3600e3,
    DROP_GRACE_MS: 20000      // kopan oyuncunun dönmesi için beklenen süre
  });

  /* Oturum depolaması (sekmeye özel; yenilemede korunur) */
  const Session = {
    get(k) { try { return JSON.parse(window.sessionStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { window.sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* yok say */ } },
    del(k) { try { window.sessionStorage.removeItem(k); } catch (e) { /* yok say */ } }
  };

  /** Bu sekmenin kalıcı oyuncu kimliği (yeniden bağlanmada aynı oyuncu olarak tanınır) */
  const clientId = (() => {
    let id = Session.get(NET.CLIENT_KEY);
    if (typeof id !== 'string' || !/^p[a-z0-9]{10}$/.test(id)) {
      const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
      id = 'p' + Array.from({ length: 10 }, () => chars[randInt(chars.length)]).join('');
      Session.set(NET.CLIENT_KEY, id);
    }
    return id;
  })();

  /** Oyunun sürümü ve soru bankası herkeste aynı olmalı */
  const bankSignature = () => {
    const all = QuestionRepository.all();
    return `${NET.VERSION}:${all.length}:${all.length ? all[all.length - 1].id : ''}`;
  };

  const NET_ERRORS = {
    'browser-incompatible': 'Tarayıcın online oyunu (WebRTC) desteklemiyor.',
    network: 'Bağlantı sunucusuna ulaşılamadı. İnternet bağlantını kontrol et.',
    'server-error': 'Bağlantı sunucusu şu an yanıt vermiyor. Biraz sonra tekrar dene.',
    'socket-error': 'Bağlantı sunucusuyla iletişim koptu.',
    'socket-closed': 'Bağlantı sunucusuyla iletişim koptu.',
    'ssl-unavailable': 'Güvenli bağlantı kurulamadı.',
    'unavailable-id': 'Oda kodu kullanımda. Tekrar dene.'
  };
  const REJECT_REASONS = {
    full: 'Oda dolu (en fazla 4 oyuncu).',
    started: 'Maç başlamış; şu an odaya katılamazsın.',
    version: 'Oyunun farklı bir sürümünü kullanıyorsunuz. İki taraf da sayfayı yenilemeli.',
    invalid: 'Odaya katılım isteği geçersiz.'
  };

  const sendTo = (conn, obj) => {
    try { if (conn && conn.open) conn.send(obj); } catch (e) { /* bağlantı kapanmış olabilir */ }
  };
  const isMsg = m => m && typeof m === 'object' && typeof m.type === 'string';

  /** Misafirin aldığı oda durumunu doğrular (güvenilmeyen veri) */
  function sanitizeRoom(st) {
    if (!st || typeof st !== 'object') return null;
    if (!['lobby', 'question', 'reveal', 'finished'].includes(st.phase)) return null;
    if (!Array.isArray(st.players) || !st.players.length || st.players.length > CONFIG.MP_MAX) return null;
    const players = st.players.filter(p => p && typeof p.id === 'string').map((p, i) => ({
      id: p.id.slice(0, 32),
      name: cleanName(p.name) || `Oyuncu ${i + 1}`,
      color: PLAYER_COLOR_MAP.has(p.color) ? p.color : PLAYER_COLORS[i].key,
      connected: !!p.connected
    }));
    const qids = Array.isArray(st.questionIds) ? st.questionIds.filter(id => typeof id === 'string') : [];
    if (qids.some(id => !QuestionRepository.has(id))) return null;   // farklı soru bankası
    const pidSet = new Set(players.map(p => p.id));
    const cleanGuesses = g => {
      const out = {};
      if (g && typeof g === 'object') Object.keys(g).forEach(k => { if (pidSet.has(k) && isNum(g[k]) && g[k] >= 0) out[k] = g[k]; });
      return out;
    };
    const history = (Array.isArray(st.history) ? st.history : [])
      .filter((h, i) => h && h.qid === qids[i])
      .map(h => ({ qid: h.qid, guesses: cleanGuesses(h.guesses) }));
    const submitted = {};
    if (st.submitted && typeof st.submitted === 'object') Object.keys(st.submitted).forEach(k => { if (pidSet.has(k) && st.submitted[k]) submitted[k] = true; });
    const settings = st.settings && typeof st.settings === 'object' ? st.settings : {};
    return {
      code: typeof st.code === 'string' ? st.code.slice(0, 8) : '',
      phase: st.phase,
      hostId: typeof st.hostId === 'string' ? st.hostId : '',
      players,
      settings: {
        rounds: CONFIG.MP_ROUND_OPTIONS.includes(settings.rounds) ? settings.rounds : 10,
        category: settings.category === MIXED || CAT_MAP.has(settings.category) ? settings.category : MIXED
      },
      category: st.category === MIXED || CAT_MAP.has(st.category) ? st.category : MIXED,
      questionIds: qids,
      index: Number.isInteger(st.index) ? clamp(st.index, 0, qids.length) : 0,
      submitted,
      history,
      matchId: typeof st.matchId === 'string' ? st.matchId.slice(0, 24) : ''
    };
  }

  /** Bir turun sonuçları; cevap vermeyen oyuncu "missing" olarak işaretlenir */
  function onlineRoundResults(room, entry) {
    const q = QuestionRepository.get(entry.qid);
    const res = room.players.map(p => {
      const g = entry.guesses[p.id];
      if (!q || !isNum(g)) return { missing: true, score: 0, accuracy: 0, exact: false };
      return GameEngine.evaluate(q, g);
    });
    const scores = res.filter(r => !r.missing).map(r => r.score).sort((a, b) => b - a);
    const best = scores.length ? scores[0] : 0;
    return res.map(r => Object.assign(r, {
      winner: !r.missing && best > 0 && r.score === best,
      rank: r.missing ? null : scores.indexOf(r.score) + 1
    }));
  }

  function onlineStandings(room) {
    const rows = room.players.map((p, i) => ({ index: i, id: p.id, name: p.name, color: p.color, connected: p.connected, total: 0, accSum: 0, exact: 0, wins: 0, count: 0 }));
    room.history.forEach(entry => {
      onlineRoundResults(room, entry).forEach((r, i) => {
        if (r.missing) return;
        const row = rows[i];
        row.total += r.score; row.accSum += r.accuracy; row.count += 1;
        if (r.exact) row.exact += 1;
        if (r.winner) row.wins += 1;
      });
    });
    rows.forEach(r => { r.avg = r.count ? r.accSum / r.count : 0; });
    const ranked = rows.slice().sort((a, b) => b.total - a.total || b.avg - a.avg);
    ranked.forEach((r, i) => {
      r.rank = i > 0 && r.total === ranked[i - 1].total && r.avg === ranked[i - 1].avg ? ranked[i - 1].rank : i + 1;
    });
    return rows;
  }

  function onlineSummary(room) {
    const players = onlineStandings(room);
    return {
      players,
      ranked: players.slice().sort((a, b) => a.rank - b.rank),
      rounds: room.history.map(e => ({ qid: e.qid, results: onlineRoundResults(room, e) })),
      category: room.category,
      planned: room.questionIds.length
    };
  }

  const Online = {
    role: null,          // 'host' | 'guest'
    status: 'idle',      // idle | connecting | connected | reconnecting | error | closed
    message: '',
    code: '',
    room: null,
    peer: null,
    conns: new Map(),    // host: oyuncuId → bağlantı
    hostConn: null,      // misafir: host bağlantısı
    pending: {},         // host: açıklanmamış tahminler
    myGuesses: {},       // tur → kendi tahminim (açıklanana kadar yalnızca bende)
    retry: 0,
    timers: {},
    leaving: false,
    countedMatch: '',
    lastKey: '',
    autoRejoinTried: false,

    me() { return Store.get().multiplayer.roster[0]; },
    myName() { return cleanName(this.me().name) || 'Oyuncu'; },
    isHost() { return this.role === 'host'; },
    inRoom() { return !!this.room && (this.status === 'connected' || this.status === 'reconnecting'); },

    /* ---------- Kütüphane & yardımcılar ---------- */
    loadLib() {
      if (window.Peer) return Promise.resolve();
      if (this._lib) return this._lib;
      this._lib = new Promise((resolve, reject) => {
        const tryAt = i => {
          if (i >= NET.LIBS.length) { this._lib = null; reject(new Error('peerjs')); return; }
          const s = document.createElement('script');
          s.src = NET.LIBS[i];
          s.async = true;
          s.crossOrigin = 'anonymous';
          s.onload = () => (window.Peer ? resolve() : tryAt(i + 1));
          s.onerror = () => { s.remove(); tryAt(i + 1); };
          document.head.appendChild(s);
        };
        tryAt(0);
      });
      return this._lib;
    },
    /** ?peer=host:port ile kendi PeerServer'ını kullanabilirsin (varsayılan: PeerJS bulutu) */
    peerOptions() {
      const o = { debug: 0 };
      try {
        const p = new URLSearchParams(window.location.search).get('peer');
        if (p && /^[\w.-]+(:\d+)?$/.test(p)) {
          const [host, port] = p.split(':');
          Object.assign(o, { host, port: Number(port) || 9000, path: '/', secure: window.location.protocol === 'https:' });
        }
      } catch (e) { /* varsayılan */ }
      return o;
    },
    newCode() {
      return Array.from({ length: NET.CODE_LENGTH }, () => NET.CODE_ALPHABET[randInt(NET.CODE_ALPHABET.length)]).join('');
    },
    peerIdFor(code) { return NET.ID_PREFIX + code.toLowerCase(); },
    clearTimers() { Object.values(this.timers).forEach(t => clearTimeout(t)); this.timers = {}; },
    teardown() {
      this.clearTimers();
      const peer = this.peer;
      this.peer = null;
      this.conns.forEach(c => { try { c.close(); } catch (e) { /* yok say */ } });
      this.conns.clear();
      if (this.hostConn) { try { this.hostConn.close(); } catch (e) { /* yok say */ } }
      this.hostConn = null;
      if (peer) { try { peer.destroy(); } catch (e) { /* yok say */ } }
    },
    reset() {
      this.teardown();
      Object.assign(this, { role: null, status: 'idle', message: '', code: '', room: null, pending: {}, myGuesses: {}, retry: 0, leaving: false, lastKey: '' });
    },
    fail(message, status = 'error') {
      const role = this.role; const code = this.code;
      this.teardown();
      Object.assign(this, { status, message, room: null, role, code });
      this.update();
    },
    /** Her durum değişiminde arayüzü güncelle */
    update() {
      const key = this.room ? `${this.room.phase}:${this.room.index}:${this.room.matchId}` : this.status;
      const changed = key !== this.lastKey;
      this.lastKey = key;
      // Tur açıklandığında tam isabet varsa konfeti
      if (changed && this.room && this.room.phase === 'reveal') {
        const entry = this.room.history[this.room.index];
        const i = this.room.players.findIndex(p => p.id === clientId);
        if (entry && i !== -1) {
          const r = onlineRoundResults(this.room, entry)[i];
          if (r && r.exact) Confetti.fire(0.8);
        }
      }
      if (changed && this.room && this.room.phase === 'finished' && this.countedMatch !== this.room.matchId) {
        this.countedMatch = this.room.matchId;
        Store.get().multiplayer.matchesPlayed += 1;
        Store.save();
        App.celebrate = true;
      }
      renderOnline(changed);
    },

    /* ================= HOST ================= */
    async create(reopen = false) {
      this.reset();
      Object.assign(this, { role: 'host', status: 'connecting', message: reopen ? 'Oda yeniden açılıyor…' : 'Oda oluşturuluyor…' });
      this.update();
      try { await this.loadLib(); } catch (e) { this.fail('Bağlantı kütüphanesi yüklenemedi. İnternet bağlantını kontrol et.'); return; }
      const snap = reopen ? readHostSnapshot() : null;
      this.openHostPeer(snap ? snap.room.code : this.newCode(), snap, 0);
    },
    openHostPeer(code, snap, attempt) {
      let peer;
      try { peer = new window.Peer(this.peerIdFor(code), this.peerOptions()); } catch (e) { this.fail(NET_ERRORS['browser-incompatible']); return; }
      this.peer = peer;
      peer.on('open', () => {
        if (this.peer !== peer) return;
        this.code = code;
        this.status = 'connected';
        if (snap) {
          this.room = snap.room;
          this.pending = snap.pending || {};
          this.room.players.forEach(p => { p.connected = p.id === clientId; });
          Toast.show('Oda yeniden açıldı. Oyuncular otomatik olarak bağlanacak.', 'success');
        } else {
          const mp = Store.get().multiplayer;
          this.room = {
            code, phase: 'lobby', hostId: clientId,
            players: [{ id: clientId, name: this.myName(), color: this.me().color, connected: true }],
            settings: { rounds: mp.settings.rounds, category: mp.settings.category },
            category: mp.settings.category,
            questionIds: [], index: 0, submitted: {}, history: [], matchId: ''
          };
        }
        this.changed();
      });
      peer.on('connection', conn => this.acceptConn(conn));
      peer.on('disconnected', () => {
        // Sinyal sunucusuyla bağlantı koptu; mevcut oyuncu bağlantıları sürer
        if (this.peer === peer && !this.leaving && !peer.destroyed) { try { peer.reconnect(); } catch (e) { /* yok say */ } }
      });
      peer.on('error', err => {
        if (this.peer !== peer) return;
        const type = err && err.type;
        if (type === 'unavailable-id') {
          try { peer.destroy(); } catch (e) { /* yok say */ }
          if (snap && attempt < 10) {
            // Eski bağlantının sunucudan düşmesi birkaç saniye sürebilir
            this.message = 'Oda yeniden açılıyor… (eski bağlantının kapanması bekleniyor)';
            this.update();
            this.timers.reopen = setTimeout(() => this.openHostPeer(code, snap, attempt + 1), 3000);
            return;
          }
          if (!snap && attempt < 5) { this.openHostPeer(this.newCode(), null, attempt + 1); return; }
          this.fail('Oda açılamadı. Biraz sonra tekrar dene.');
          return;
        }
        if (this.status !== 'connected' && NET_ERRORS[type]) this.fail(NET_ERRORS[type]);
      });
    },
    acceptConn(conn) {
      conn.on('data', data => this.hostReceive(conn, data));
      conn.on('close', () => this.hostConnClosed(conn));
      conn.on('error', () => this.hostConnClosed(conn));
    },
    freeColor(wanted, exceptId) {
      const used = new Set(this.room.players.filter(p => p.id !== exceptId).map(p => p.color));
      if (PLAYER_COLOR_MAP.has(wanted) && !used.has(wanted)) return wanted;
      return (PLAYER_COLORS.find(c => !used.has(c.key)) || PLAYER_COLORS[0]).key;
    },
    hostReceive(conn, msg) {
      if (!isMsg(msg) || !this.room) return;
      const room = this.room;
      switch (msg.type) {
        case 'hello': {
          if (msg.sig !== bankSignature()) { sendTo(conn, { type: 'reject', reason: 'version' }); return; }
          const id = typeof msg.id === 'string' && /^p[a-z0-9]{10}$/.test(msg.id) ? msg.id : '';
          if (!id || id === room.hostId) { sendTo(conn, { type: 'reject', reason: 'invalid' }); return; }
          let p = room.players.find(x => x.id === id);
          if (!p) {
            if (room.phase !== 'lobby') { sendTo(conn, { type: 'reject', reason: 'started' }); return; }
            if (room.players.length >= CONFIG.MP_MAX) { sendTo(conn, { type: 'reject', reason: 'full' }); return; }
            p = { id, name: cleanName(msg.name) || `Oyuncu ${room.players.length + 1}`, color: this.freeColor(msg.color, id), connected: true };
            room.players.push(p);
            Toast.show(`${p.name} odaya katıldı.`, 'success');
          } else {
            const old = this.conns.get(id);
            if (old && old !== conn) { old._replaced = true; try { old.close(); } catch (e) { /* yok say */ } }
            if (!p.connected) Toast.show(`${p.name} yeniden bağlandı.`, 'info');
            p.connected = true;
            p.droppedAt = 0;
          }
          conn._pid = id;
          this.conns.set(id, conn);
          sendTo(conn, { type: 'welcome', id });
          this.changed();
          break;
        }
        case 'guess':
          if (conn._pid) this.record(conn._pid, msg.index, msg.value);
          break;
        case 'leave':
          if (conn._pid) this.dropPlayer(conn._pid, true);
          break;
        default: break;
      }
    },
    hostConnClosed(conn) {
      if (conn._replaced || !conn._pid || !this.room || this.conns.get(conn._pid) !== conn) return;
      this.dropPlayer(conn._pid, false);
    },
    dropPlayer(pid, left) {
      const room = this.room;
      const p = room && room.players.find(x => x.id === pid);
      this.conns.delete(pid);
      if (!p || pid === room.hostId) return;
      if (room.phase === 'lobby') room.players = room.players.filter(x => x !== p);
      else {
        p.connected = false;
        // Kısa kopmalarda turu hemen açıklama; oyuncuya geri dönmesi için süre tanı
        p.droppedAt = left ? 0 : Date.now();
      }
      Toast.show(left ? `${p.name} odadan ayrıldı.` : `${p.name} bağlantısı koptu.`, 'info');
      this.changed();
      if (room.phase === 'question') {
        this.checkAllSubmitted();
        if (!left) {
          clearTimeout(this.timers.grace);
          this.timers.grace = setTimeout(() => this.checkAllSubmitted(), NET.DROP_GRACE_MS + 100);
        }
      }
    },
    changed() {
      this.persist();
      const st = this.publicState();
      this.conns.forEach(c => sendTo(c, { type: 'state', state: st }));
      this.update();
    },
    publicState() {
      const r = this.room;
      return {
        code: r.code, phase: r.phase, hostId: r.hostId,
        players: r.players.map(p => ({ id: p.id, name: p.name, color: p.color, connected: p.connected })),
        settings: Object.assign({}, r.settings),
        category: r.category,
        questionIds: r.questionIds.slice(),
        index: r.index,
        submitted: Object.assign({}, r.submitted),
        history: r.history.map(h => ({ qid: h.qid, guesses: Object.assign({}, h.guesses) })),
        matchId: r.matchId
      };
    },
    persist() {
      if (this.role === 'host' && this.room) {
        StorageAdapter.write(NET.HOST_KEY, JSON.stringify({ room: this.room, pending: this.pending, savedAt: Date.now() }));
      }
    },
    updateSettings(patch) {
      if (!this.isHost() || !this.room || this.room.phase !== 'lobby') return;
      const mp = Store.get().multiplayer;
      if (CONFIG.MP_ROUND_OPTIONS.includes(patch.rounds)) { this.room.settings.rounds = patch.rounds; mp.settings.rounds = patch.rounds; }
      if (patch.category === MIXED || CAT_MAP.has(patch.category)) { this.room.settings.category = patch.category; mp.settings.category = patch.category; }
      Store.save();
      this.changed();
    },
    startMatch() {
      const room = this.room;
      if (!this.isHost() || !room) return;
      const active = room.players.filter(p => p.connected);
      if (active.length < CONFIG.MP_MIN) { Toast.show('Maçı başlatmak için en az 2 bağlı oyuncu gerekli.', 'error'); return; }
      const mp = Store.get().multiplayer;
      const pool = QuestionRepository.byCategory(room.settings.category);
      const rounds = Math.min(room.settings.rounds, pool.length);
      const used = new Set(mp.usedQuestionIds);
      let picked = shuffle(pool.filter(q => !used.has(q.id)));
      if (picked.length < rounds) {
        const cids = new Set(pool.map(q => q.id));
        mp.usedQuestionIds = mp.usedQuestionIds.filter(id => !cids.has(id));
        const have = new Set(picked.map(q => q.id));
        picked = picked.concat(shuffle(pool.filter(q => !have.has(q.id))));
      }
      const qids = picked.slice(0, rounds).map(q => q.id);
      qids.forEach(id => { if (!mp.usedQuestionIds.includes(id)) mp.usedQuestionIds.push(id); });
      Store.save();
      Object.assign(room, {
        players: active,
        category: room.settings.category,
        questionIds: qids, index: 0, history: [], submitted: {},
        phase: 'question',
        matchId: Date.now().toString(36)
      });
      this.pending = {};
      this.myGuesses = {};
      this.changed();
    },
    record(pid, index, value) {
      const room = this.room;
      if (!room || room.phase !== 'question' || index !== room.index) return;
      if (!isNum(value) || value < 0 || value > CONFIG.MAX_INPUT) return;
      if (!room.players.some(p => p.id === pid) || room.submitted[pid]) return;
      this.pending[pid] = value;
      room.submitted[pid] = true;
      this.changed();
      this.checkAllSubmitted();
    },
    checkAllSubmitted() {
      const room = this.room;
      if (!room || room.phase !== 'question') return;
      const now = Date.now();
      // Bağlı oyuncular + yeni kopup geri dönmesi beklenenler
      const waiting = room.players.filter(p => p.connected || (p.droppedAt && now - p.droppedAt < NET.DROP_GRACE_MS));
      if (waiting.length && waiting.every(p => room.submitted[p.id])) this.reveal();
    },
    reveal() {
      const room = this.room;
      if (!room || room.phase !== 'question') return;
      room.history.push({ qid: room.questionIds[room.index], guesses: Object.assign({}, this.pending) });
      this.pending = {};
      room.phase = 'reveal';
      this.changed();
    },
    skipWaiting() {
      if (!this.isHost() || !this.room || this.room.phase !== 'question') return;
      if (!Object.keys(this.room.submitted).length) { Toast.show('Henüz kimse cevap vermedi.', 'error'); return; }
      this.reveal();
    },
    nextRound() {
      const room = this.room;
      if (!this.isHost() || !room || room.phase !== 'reveal') return;
      room.index += 1;
      room.submitted = {};
      room.phase = room.index >= room.questionIds.length ? 'finished' : 'question';
      this.changed();
    },
    backToLobby() {
      const room = this.room;
      if (!this.isHost() || !room) return;
      Object.assign(room, { phase: 'lobby', players: room.players.filter(p => p.connected), questionIds: [], index: 0, history: [], submitted: {}, matchId: '' });
      this.pending = {};
      this.changed();
    },
    closeRoom() {
      this.leaving = true;
      this.conns.forEach(c => sendTo(c, { type: 'closed' }));
      StorageAdapter.remove(NET.HOST_KEY);
      setTimeout(() => { this.reset(); this.update(); }, 200);
    },

    /* ================= MİSAFİR ================= */
    async join(code) {
      const clean = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (clean.length !== NET.CODE_LENGTH || [...clean].some(ch => !NET.CODE_ALPHABET.includes(ch))) {
        Toast.show(`Oda kodu ${NET.CODE_LENGTH} karakter olmalı.`, 'error');
        return;
      }
      this.reset();
      Object.assign(this, { role: 'guest', status: 'connecting', code: clean, message: `${clean} odasına bağlanılıyor…` });
      this.update();
      try { await this.loadLib(); } catch (e) { this.fail('Bağlantı kütüphanesi yüklenemedi. İnternet bağlantını kontrol et.'); return; }
      this.openGuestPeer();
      this.timers.join = setTimeout(() => {
        if (this.status === 'connecting') this.fail('Odaya bağlanılamadı. Kodu ve internet bağlantını kontrol et.');
      }, NET.JOIN_TIMEOUT_MS);
    },
    openGuestPeer() {
      let peer;
      try { peer = new window.Peer(this.peerOptions()); } catch (e) { this.fail(NET_ERRORS['browser-incompatible']); return; }
      this.peer = peer;
      peer.on('open', () => { if (this.peer === peer) this.connectToHost(); });
      peer.on('disconnected', () => {
        if (this.peer === peer && !this.leaving && !peer.destroyed) { try { peer.reconnect(); } catch (e) { /* yok say */ } }
      });
      peer.on('error', err => {
        if (this.peer !== peer) return;
        const type = err && err.type;
        if (type === 'peer-unavailable') {
          if (this.status === 'reconnecting') { this.scheduleReconnect(); return; }
          if (this.status === 'connecting') this.fail('Oda bulunamadı. Kodu kontrol et ve ev sahibinin odayı açık tuttuğundan emin ol.');
          return;
        }
        if (this.status === 'reconnecting') { this.scheduleReconnect(); return; }
        if (this.status === 'connecting' && NET_ERRORS[type]) this.fail(NET_ERRORS[type]);
      });
    },
    connectToHost() {
      if (!this.peer || this.peer.destroyed) return;
      let conn;
      try { conn = this.peer.connect(this.peerIdFor(this.code), { reliable: true, serialization: 'json' }); } catch (e) { this.scheduleReconnect(); return; }
      this.hostConn = conn;
      conn.on('open', () => {
        const me = this.me();
        sendTo(conn, { type: 'hello', id: clientId, name: this.myName(), color: me.color, sig: bankSignature() });
      });
      conn.on('data', data => this.guestReceive(conn, data));
      conn.on('close', () => this.hostLost(conn));
      conn.on('error', () => this.hostLost(conn));
    },
    guestReceive(conn, msg) {
      if (conn !== this.hostConn || !isMsg(msg)) return;
      switch (msg.type) {
        case 'welcome':
          clearTimeout(this.timers.join);
          clearTimeout(this.timers.retry);
          this.retry = 0;
          if (this.status === 'reconnecting') Toast.show('Bağlantı yeniden kuruldu.', 'success');
          this.status = 'connected';
          Session.set(NET.GUEST_KEY, { code: this.code, at: Date.now() });
          this.update();
          break;
        case 'state': {
          const st = sanitizeRoom(msg.state);
          if (!st) { this.leave(); this.fail(REJECT_REASONS.version); return; }
          this.room = st;
          if (this.status === 'connecting') this.status = 'connected';
          this.update();
          break;
        }
        case 'reject':
          Session.del(NET.GUEST_KEY);
          this.leaving = true;
          this.fail(REJECT_REASONS[msg.reason] || REJECT_REASONS.invalid);
          break;
        case 'closed':
          Session.del(NET.GUEST_KEY);
          this.leaving = true;
          this.fail('Ev sahibi odayı kapattı.', 'closed');
          break;
        default: break;
      }
    },
    hostLost(conn) {
      if (conn !== this.hostConn || this.leaving || this.role !== 'guest') return;
      if (this.status === 'connecting') return;   // ilk bağlantıda zaman aşımı devreye girer
      if (this.status !== 'reconnecting') { this.status = 'reconnecting'; this.retry = 0; this.update(); }
      this.scheduleReconnect();
    },
    scheduleReconnect() {
      clearTimeout(this.timers.retry);
      if (this.retry >= NET.RECONNECT_TRIES) {
        Session.del(NET.GUEST_KEY);
        this.fail('Ev sahibiyle bağlantı koptu. Oda kapanmış olabilir.');
        return;
      }
      this.retry += 1;
      this.timers.retry = setTimeout(() => {
        if (this.role !== 'guest' || this.status !== 'reconnecting') return;
        if (!this.peer || this.peer.destroyed) { this.openGuestPeer(); return; }
        if (this.peer.disconnected) { try { this.peer.reconnect(); } catch (e) { /* yok say */ } }
        this.connectToHost();
      }, NET.RECONNECT_DELAY_MS);
    },
    leave() {
      if (this.role === 'guest') {
        this.leaving = true;
        sendTo(this.hostConn, { type: 'leave' });
        Session.del(NET.GUEST_KEY);
        setTimeout(() => { this.reset(); this.update(); }, 200);
      } else if (this.role === 'host') {
        this.closeRoom();
      } else {
        this.reset(); this.update();
      }
    },

    /* ================= ORTAK ================= */
    submitGuess(value) {
      const room = this.room;
      if (!room || room.phase !== 'question' || room.submitted[clientId]) return false;
      this.myGuesses[room.index] = value;
      if (this.isHost()) this.record(clientId, room.index, value);
      else {
        if (!this.hostConn || !this.hostConn.open) { Toast.show('Bağlantı yok; cevabın gönderilemedi.', 'error'); delete this.myGuesses[room.index]; return false; }
        sendTo(this.hostConn, { type: 'guess', index: room.index, value });
        this.update();
      }
      return true;
    },
    /** Sayfa açılışında: yarım kalan misafir oturumuna otomatik dön */
    tryAutoRejoin() {
      if (this.autoRejoinTried || this.role || this.status !== 'idle') return;
      this.autoRejoinTried = true;
      const s = Session.get(NET.GUEST_KEY);
      if (s && typeof s.code === 'string' && isNum(s.at) && Date.now() - s.at < 2 * 3600e3) this.join(s.code);
    }
  };

  function readHostSnapshot() {
    try {
      const raw = JSON.parse(StorageAdapter.read(NET.HOST_KEY));
      if (!raw || !raw.room || !isNum(raw.savedAt) || Date.now() - raw.savedAt > NET.SNAPSHOT_TTL_MS) return null;
      const oldHost = typeof raw.room.hostId === 'string' ? raw.room.hostId : '';
      const room = sanitizeRoom(raw.room);
      if (!room || !room.code || !oldHost) return null;
      // Oda başka bir sekmede yeniden açılırsa host kimliğini bu sekmeye taşı
      const remap = id => (id === oldHost ? clientId : id);
      const remapKeys = obj => Object.keys(obj).reduce((o, k) => { o[remap(k)] = obj[k]; return o; }, {});
      room.players.forEach(p => { p.id = remap(p.id); });
      if (!room.players.some(p => p.id === clientId)) return null;
      room.history.forEach(h => { h.guesses = remapKeys(h.guesses); });
      room.submitted = remapKeys(room.submitted);
      room.hostId = clientId;
      const pending = {};
      if (raw.pending && typeof raw.pending === 'object') {
        Object.keys(raw.pending).forEach(k => { if (isNum(raw.pending[k])) pending[remap(k)] = raw.pending[k]; });
      }
      return { room, pending };
    } catch (e) { return null; }
  }


  /* ======================================================================
     10. SAYI GİRİŞİ — canlı binlik ayırıcı, ondalık virgül, doğrulama
     ====================================================================== */
  const NumberInput = {
    /** Serbest metni sayıya çevirir. Dönen: { ok, value } veya { ok:false, message } */
    parse(str, isYear) {
      const s = String(str == null ? '' : str).replace(/[\s  ]/g, '');
      if (!s) return { ok: false, message: 'Lütfen bir tahmin gir.' };
      if (/[-−]/.test(s)) return { ok: false, message: 'Negatif değer girilemez.' };
      if (/[^0-9.,]/.test(s)) return { ok: false, message: 'Yalnızca sayı girebilirsin.' };
      let intPart = s; let decPart = '';
      if (s.includes(',')) {
        const segs = s.split(',');
        if (segs.length > 2 || segs[1].includes('.')) return { ok: false, message: 'Geçerli bir sayı gir.' };
        intPart = segs[0].replace(/\./g, '');
        decPart = segs[1];
      } else {
        const dots = (s.match(/\./g) || []).length;
        if (dots === 1) {
          const [a, b] = s.split('.');
          // Türkçe yazımda "1.500" binlik; "3.5" ondalık kabul edilir
          if (b.length === 3 && a.length > 0 && !isYear) { intPart = a + b; } else { intPart = a; decPart = b; }
        } else if (dots > 1) {
          intPart = s.replace(/\./g, '');
        }
      }
      if (!/^\d*$/.test(intPart) || !/^\d*$/.test(decPart) || (!intPart && !decPart)) {
        return { ok: false, message: 'Geçerli bir sayı gir.' };
      }
      const value = Number((intPart || '0') + (decPart ? '.' + decPart : ''));
      if (!Number.isFinite(value)) return { ok: false, message: 'Geçerli bir sayı gir.' };
      if (value > CONFIG.MAX_INPUT) return { ok: false, message: 'Tahminin çok büyük.' };
      return { ok: true, value };
    },
    /** Sayıyı giriş alanında gösterilecek metne çevirir */
    toInputString(value, isYear) {
      if (isYear) return String(Math.round(value));
      return NF_DEC.format(value);
    },
    /** Yazarken biçimlendirme; imleç konumunu korur */
    onInput(e) {
      const el = e.target;
      const isYear = el.dataset.year === '1';
      let v = el.value;
      let caret = el.selectionStart == null ? v.length : el.selectionStart;

      if (e.inputType === 'insertFromPaste' || e.inputType === 'insertFromDrop') {
        const p = this.parse(v, isYear);
        if (p.ok) { el.value = this.toInputString(p.value, isYear); this.afterChange(el); return; }
        if (/[-−]/.test(v)) { el.value = ''; this.afterChange(el); this.showError(el, 'Negatif değer girilemez.'); return; }
      }
      if (e.inputType === 'insertText' && (e.data === '-' || e.data === '−')) {
        this.showError(el, 'Negatif değer girilemez.');
      }
      const MARK = '\u0001';
      if (!isYear && e.inputType === 'insertText' && (e.data === '.' || e.data === ',') && caret > 0) {
        // Kullanıcının yazdığı nokta/virgül ondalık ayırıcı kabul edilir
        if (v[caret - 1] === '.' || v[caret - 1] === ',') v = v.slice(0, caret - 1) + MARK + v.slice(caret);
      }
      const decIndex = v.indexOf(MARK) !== -1 ? v.indexOf(MARK) : v.indexOf(',');
      let out = ''; let sig = 0; let caretSig = -1; let hasDec = false;
      for (let i = 0; i < v.length; i++) {
        if (i === caret) caretSig = sig;
        const ch = v[i];
        if (ch >= '0' && ch <= '9') { out += ch; sig++; } else if (!isYear && i === decIndex && !hasDec) { out += ','; hasDec = true; sig++; }
      }
      if (caretSig === -1) caretSig = sig;

      let [intP, decP = ''] = out.split(',');
      const before = intP.length;
      intP = intP.replace(/^0+(?=\d)/, '');
      caretSig = Math.max(0, caretSig - Math.min(before - intP.length, caretSig));
      if (hasDec && intP === '') { intP = '0'; caretSig += 1; }
      const maxInt = isYear ? 4 : CONFIG.MAX_INT_DIGITS;
      if (intP.length > maxInt) intP = intP.slice(0, maxInt);
      if (decP.length > CONFIG.MAX_DEC_DIGITS) decP = decP.slice(0, CONFIG.MAX_DEC_DIGITS);

      const grouped = isYear ? intP : intP.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      const formatted = grouped + (hasDec ? ',' + decP : '');

      let pos = formatted.length; let count = 0;
      if (caretSig === 0) pos = 0;
      else {
        for (let i = 0; i < formatted.length; i++) {
          const ch = formatted[i];
          if ((ch >= '0' && ch <= '9') || ch === ',') count++;
          if (count >= caretSig) { pos = i + 1; break; }
        }
      }
      el.value = formatted;
      if (document.activeElement === el) {
        try { el.setSelectionRange(pos, pos); } catch (err) { /* bazı tarayıcılar */ }
      }
      if (!(e.inputType === 'insertText' && (e.data === '-' || e.data === '−'))) this.afterChange(el);
    },
    afterChange(el) {
      const wrap = el.closest('.input-wrap');
      if (wrap) wrap.classList.remove('has-error');
      el.removeAttribute('aria-invalid');
      const err = document.getElementById(el.dataset.error || 'guess-error'); if (err) err.textContent = '';
      const p = this.parse(el.value, el.dataset.year === '1');
      const status = el.dataset.status ? document.getElementById(el.dataset.status) : null;
      if (status) {
        status.textContent = p.ok ? 'Hazır' : 'Bekleniyor';
        status.classList.toggle('is-ready', p.ok);
      }
      const hint = document.getElementById(el.dataset.hint || 'guess-hint');
      if (!hint) return;
      const h = p.ok && !el.classList.contains('is-masked') ? humanize(p.value) : '';
      hint.innerHTML = h ? `<span class="hint-human">${escapeHTML(h)}</span>` : escapeHTML(hint.dataset.default || '');
    },
    showError(el, message) {
      const wrap = el.closest('.input-wrap');
      if (wrap) {
        wrap.classList.remove('has-error');
        void wrap.offsetWidth; // animasyonu yeniden tetikle
        wrap.classList.add('has-error');
      }
      el.setAttribute('aria-invalid', 'true');
      const err = document.getElementById(el.dataset.error || 'guess-error'); if (err) err.textContent = message;
      el.focus();
    }
  };

  /* ======================================================================
     11. ARAYÜZ BİLEŞENLERİ
     ====================================================================== */

  /* --- Toast bildirimleri --- */
  const Toast = {
    show(msg, type = 'info', duration = 3600) {
      const region = $('#toast-region');
      if (!region) return;
      const t = document.createElement('div');
      t.className = `toast toast-${type}`;
      const ic = type === 'success' ? 'check' : type === 'error' ? 'alert' : 'info';
      t.innerHTML = `<span class="toast-icon">${icon(ic)}</span><span class="toast-msg">${escapeHTML(msg)}</span>` +
        `<button class="toast-close" type="button" aria-label="Bildirimi kapat">${icon('x')}</button>`;
      region.appendChild(t);
      while (region.children.length > 3) region.firstElementChild.remove();
      requestAnimationFrame(() => t.classList.add('is-in'));
      let removed = false;
      const remove = () => {
        if (removed) return; removed = true;
        t.classList.remove('is-in'); t.classList.add('is-out');
        setTimeout(() => t.remove(), 260);
      };
      const timer = setTimeout(remove, duration);
      t.querySelector('.toast-close').addEventListener('click', () => { clearTimeout(timer); remove(); });
    }
  };

  /* --- Modal (yalnızca önemli işlemler için) --- */
  const Modal = (() => {
    let current = null; let lastFocus = null;
    function trap(e) {
      if (!current) return;
      if (e.key === 'Escape') { e.preventDefault(); close(); return; }
      if (e.key !== 'Tab') return;
      const f = $$('button', current);
      if (!f.length) return;
      const first = f[0]; const last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    function open({ title, body, confirmText = 'Onayla', cancelText = 'Vazgeç', danger = false, iconName = 'info', onConfirm }) {
      close(true);
      lastFocus = document.activeElement;
      const wrap = document.createElement('div');
      wrap.className = 'modal-backdrop';
      wrap.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-body">
          <div class="modal-icon ${danger ? 'danger' : ''}">${icon(iconName, 'ico-lg')}</div>
          <h2 id="modal-title" class="modal-title">${escapeHTML(title)}</h2>
          <p id="modal-body" class="modal-body">${escapeHTML(body)}</p>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-modal="cancel">${escapeHTML(cancelText)}</button>
            <button type="button" class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-modal="confirm"><span class="btn-label">${escapeHTML(confirmText)}</span></button>
          </div>
        </div>`;
      wrap.addEventListener('click', e => {
        if (e.target === wrap) { close(); return; }
        const b = e.target.closest('[data-modal]');
        if (!b) return;
        const confirmed = b.dataset.modal === 'confirm';
        close();
        if (confirmed && onConfirm) {
          try { onConfirm(); } catch (err) { console.error(err); Toast.show('İşlem sırasında bir hata oluştu.', 'error'); }
        }
      });
      wrap.addEventListener('keydown', trap);
      document.body.appendChild(wrap);
      document.body.classList.add('modal-open');
      current = wrap;
      requestAnimationFrame(() => {
        wrap.classList.add('is-open');
        const target = $(danger ? '[data-modal="cancel"]' : '[data-modal="confirm"]', wrap);
        if (target) target.focus();
      });
    }
    function close(immediate) {
      if (!current) return;
      const el = current; current = null;
      document.body.classList.remove('modal-open');
      el.classList.remove('is-open');
      setTimeout(() => el.remove(), immediate || prefersReducedMotion() ? 0 : 200);
      if (lastFocus && typeof lastFocus.focus === 'function' && document.contains(lastFocus)) lastFocus.focus();
    }
    return { open, close, isOpen: () => !!current };
  })();

  /* --- Konfeti (yalnızca tam isabet ve özel başarılarda) --- */
  const Confetti = {
    fire(intensity = 1) {
      if (prefersReducedMotion()) return;
      const c = document.createElement('canvas');
      c.className = 'confetti-canvas';
      c.setAttribute('aria-hidden', 'true');
      const ctx = c.getContext && c.getContext('2d');
      if (!ctx) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const W = window.innerWidth; const H = window.innerHeight;
      c.width = W * dpr; c.height = H * dpr;
      document.body.appendChild(c);
      ctx.scale(dpr, dpr);
      const colors = ['#ff8000', '#ff9d38', '#ffd29e', '#36d399', '#f5f5f5'];
      const N = Math.round((W < 600 ? 80 : 140) * intensity);
      const parts = [];
      for (let i = 0; i < N; i++) {
        parts.push({
          x: W / 2 + (Math.random() - 0.5) * W * 0.35, y: H * 0.42,
          vx: (Math.random() - 0.5) * 15, vy: -Math.random() * 12 - 5,
          w: 6 + Math.random() * 6, h: 4 + Math.random() * 5,
          r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3, c: colors[i % colors.length]
        });
      }
      const start = performance.now(); const dur = 2600;
      const frame = t => {
        const el = t - start;
        ctx.clearRect(0, 0, W, H);
        ctx.globalAlpha = el > dur - 700 ? Math.max(0, (dur - el) / 700) : 1;
        for (const p of parts) {
          p.vy += 0.32; p.vx *= 0.985; p.vy *= 0.985;
          p.x += p.vx; p.y += p.vy; p.r += p.vr;
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
          ctx.fillStyle = p.c;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2)) + 1);
          ctx.restore();
        }
        if (el < dur) requestAnimationFrame(frame); else c.remove();
      };
      requestAnimationFrame(frame);
    }
  };

  /* --- Count-up animasyonu --- */
  function countUp(el, to, { decimals = 0, duration = 900, prefix = '', suffix = '' } = {}) {
    const nf = new Intl.NumberFormat('tr-TR', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    const fmt = v => prefix + nf.format(v) + suffix;
    if (prefersReducedMotion() || !isNum(to) || to === 0) { el.textContent = fmt(to || 0); return; }
    const start = performance.now();
    const ease = t => 1 - Math.pow(1 - t, 3);
    const step = now => {
      const p = Math.min(1, (now - start) / duration);
      el.textContent = fmt(to * ease(p));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  function runCountUps(root = document) {
    $$('[data-countup]', root).forEach(el => {
      countUp(el, parseFloat(el.dataset.countup), {
        decimals: Number(el.dataset.decimals) || 0,
        prefix: el.dataset.prefix || '',
        suffix: el.dataset.suffix || ''
      });
      el.removeAttribute('data-countup');
    });
  }
  /** count-up yapılacak sayı için HTML (JS çalışmasa bile son değer görünür) */
  const cu = (value, { decimals = 0, prefix = '' } = {}) => {
    const nf = new Intl.NumberFormat('tr-TR', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    return `<span data-countup="${value}" data-decimals="${decimals}" data-prefix="${escapeHTML(prefix)}">${escapeHTML(prefix + nf.format(value))}</span>`;
  };

  /* --- Grafikler (HTML/CSS tabanlı, erişilebilir, duyarlı) --- */
  const Charts = {
    /** Sütun grafiği: items = [{ value(0..max), label, tip, color }] */
    columns(items, { max = 100, ariaLabel = '', ticks = [100, 50, 0], tickFmt = v => v } = {}) {
      const m = max || 1;
      const bars = items.map((it, i) => `
        <div class="col" tabindex="0" style="--v:${clamp(it.value / m, 0, 1).toFixed(4)};--i:${i};--c:${it.color || 'var(--orange)'}" aria-label="${escapeHTML(it.tip.replace(/<[^>]+>/g, ''))}">
          <span class="col-bar"></span>
          <span class="col-tip" role="tooltip">${it.tip}</span>
          ${it.label ? `<span class="col-label">${escapeHTML(it.label)}</span>` : ''}
        </div>`).join('');
      return `<div class="colchart" role="group" aria-label="${escapeHTML(ariaLabel)}">
        <div class="colchart-grid" aria-hidden="true">${ticks.map(t => `<span data-v="${escapeHTML(tickFmt(t))}"></span>`).join('')}</div>
        <div class="colchart-bars">${bars}</div>
      </div>`;
    },
    /** Yatay çubuklar: rows = [{ label, iconName, dot, value, max, display, sub, color }] */
    hbars(rows) {
      return `<ul class="hbars">${rows.map((r, i) => `
        <li class="hbar">
          <div class="hbar-head">
            <span class="hbar-label">${r.dot ? `<i class="hbar-dot" style="background:${r.dot}"></i>` : ''}${r.iconName ? icon(r.iconName) : ''}${escapeHTML(r.label)}</span>
            <span class="hbar-value">${escapeHTML(r.display)}${r.sub ? `<small>${escapeHTML(r.sub)}</small>` : ''}</span>
          </div>
          <div class="hbar-track" role="presentation"><span class="hbar-fill" style="--v:${clamp((r.value || 0) / (r.max || 1), 0, 1).toFixed(4)};--i:${i};--c:${r.color || 'var(--orange)'}"></span></div>
        </li>`).join('')}</ul>`;
    },
    animateIn(root = document) {
      nextFrame(() => $$('.colchart, .hbars, .mp-slots', root).forEach(el => el.classList.add('is-in')));
    }
  };

  /** İlerleme çubukları ve göstergeler için ertelenmiş başlangıç */
  function animateMeters(root = document) {
    nextFrame(() => {
      $$('[data-progress]', root).forEach(el => el.style.setProperty('--p', el.dataset.progress));
      $$('.gauge-fill[data-offset]', root).forEach(el => { el.style.strokeDashoffset = el.dataset.offset; });
    });
  }

     12. GÖRÜNÜMLER
     ====================================================================== */

  const statTile = (label, valueHTML, iconName, { accent = false, foot = '' } = {}) => `

      </section>`;

  function updateDailyHUD() {
    const d = Store.get().daily;
    const total = d.questions.length;
    const set = (k, v) => { const el = $(`[data-hud="${k}"]`); if (el) el.textContent = v; };
    set('score', fmtInt(d.totalScore));
    set('avg', fmtPct(Daily.avgAccuracy()));
    set('answered', String(d.answers.length));
    set('remaining', String(total - d.answers.length));
