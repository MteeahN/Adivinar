  /* ---------------- Performans özeti (her iki mod) ---------------- */
  function guessCardHTML(a, kind) {
    const q = QuestionRepository.get(a.id);
    if (!q) return '';
    const lvl = GameEngine.level(a.accuracy);
    return `
      <div class="guess-card ${kind}">
        <div class="guess-card-head">
          <span class="guess-card-label">${icon(kind === 'best' ? 'up' : 'down')}${kind === 'best' ? 'En İyi Tahmin' : 'En Düşük Tahmin'}</span>
          <span class="guess-card-pct" style="color:${lvl.color}">${fmtPct(a.accuracy)}</span>
        </div>
        <p>${escapeHTML(q.text)}</p>
        <p class="meta">Tahmin: <b>${escapeHTML(fmtWithUnit(q, a.guess))}</b> · Gerçek: <b>${escapeHTML(fmtWithUnit(q, q.answer))}</b></p>
      </div>`;
  }

  function summaryHTML(sum, o) {
    const cols = sum.answers.map((a, i) => {
      const q = QuestionRepository.get(a.id);
      const lvl = GameEngine.level(a.accuracy);
      return {
        value: a.accuracy,
        color: 'var(--orange)',
        label: sum.answers.length <= 20 ? String(i + 1) : ((i + 1) % 10 === 0 || i === 0 ? String(i + 1) : ''),
        tip: `Soru ${i + 1} · <b>${escapeHTML(fmtPct(a.accuracy))}</b> · ${escapeHTML(lvl.label)}${q ? `<br>${escapeHTML(catName(q.category))}` : ''}`
      };
    });
    const catRows = sum.cats.map(c => ({
      label: catName(c.key), iconName: catIcon(c.key), value: c.avg, max: 100,
      display: fmtPct(c.avg), sub: `${c.count} soru`
    }));
    return `
      <section class="summary container" aria-labelledby="summary-title">
        <div class="summary-hero glass">
          <div class="achv" aria-hidden="true"><span class="achv-burst"></span><span class="achv-ring"></span><span class="achv-ring-2"></span>${icon('trophy')}</div>
          <h1 class="summary-title" id="summary-title">${escapeHTML(o.title)}</h1>
          <p class="summary-sub">${escapeHTML(o.subtitle)}</p>
          ${o.newRecord ? `<span class="record-badge">${icon('star')}Yeni kişisel rekor!</span>` : ''}
          <div class="score-hero"><div class="score-hero-val">${cu(sum.total)}</div><div class="score-hero-cap">TOPLAM PUAN</div></div>
          ${o.extra || ''}
        </div>

        <div class="stat-grid">
          ${statTile('Toplam Soru', cu(sum.count), 'layers')}
          ${statTile('Ortalama Yakınlık', cu(sum.avg, { decimals: 1, prefix: '%' }), 'target', { accent: true })}
          ${statTile('Tam İsabet', cu(sum.exact), 'star')}
          ${statTile('En Başarılı Kategori', sum.bestCat ? `<span style="font-size:.62em;line-height:1.2;display:block">${escapeHTML(catName(sum.bestCat.key))}</span>` : '—', 'trophy', { foot: sum.bestCat ? `Ortalama ${fmtPct(sum.bestCat.avg)}` : '' })}
        </div>

        ${sum.best && sum.worst ? `<div class="guess-cards">${guessCardHTML(sum.best, 'best')}${guessCardHTML(sum.worst, 'worst')}</div>` : ''}

        <div class="chart-grid">
          <div class="chart-card wide">
            <div class="chart-head"><h2 class="chart-title">Soru Bazında Yakınlık</h2><span class="chart-sub">Çubukların üzerine gelerek ayrıntıyı gör</span></div>
            ${Charts.columns(cols, { ariaLabel: 'Soru bazında yakınlık yüzdeleri', tickFmt: v => '%' + v })}
          </div>
          <div class="chart-card wide">
            <div class="chart-head"><h2 class="chart-title">Kategori Performansı</h2><span class="chart-sub">Ortalama yakınlık</span></div>
            ${catRows.length ? Charts.hbars(catRows) : '<p class="muted">Veri yok.</p>'}
          </div>
        </div>
        <div class="summary-actions">${o.actions || ''}</div>
      </section>`;
  }

  /* ---------------- Sınırsız mod ---------------- */
  function viewUnlimited() {
    if (App.lastUnlimitedSummary) return viewUnlimitedSummary(App.lastUnlimitedSummary);
    const s = Unlimited.session();
    if (s && s.currentId) return viewUnlimitedPlay();
    if (s && !s.currentId) {
      // Kategori bu oturumda tükendi → oyunu bitir
      const sum = Unlimited.finish();
      if (sum && sum.count) { App.lastUnlimitedSummary = sum; return viewUnlimitedSummary(sum); }
    }
    return viewUnlimitedSetup();
  }

    const u = Store.get().unlimited;
    const selected = App.lastCategory || MIXED;
    const options = [{ key: MIXED, name: 'Karışık', icon: 'shuffle' }].concat(CATEGORIES).map(c => `
      <label class="cat-option">
        <input type="radio" name="category" value="${c.key}" ${c.key === selected ? 'checked' : ''}>

  const playerHex = key => (PLAYER_COLOR_MAP.get(key) || PLAYER_COLORS[0]).hex;

  const avatar = (name, color, cls = '') => `<span class="avatar ${cls}" style="--pc:${playerHex(color)}" aria-hidden="true">${initial(name)}</span>`;
  const segHTML = (name, values, current, label, fmt = v => v) => `
    <div class="seg" role="radiogroup" aria-label="${escapeHTML(label)}">
      ${values.map(v => `<label class="seg-opt"><input type="radio" name="${name}" value="${v}" ${String(v) === String(current) ? 'checked' : ''}><span>${escapeHTML(fmt(v))}</span></label>`).join('')}
    </div>`;

    .map(c => `<option value="${c.key}" ${current === c.key ? 'selected' : ''}>${escapeHTML(c.name)} (${QuestionRepository.count(c.key)})</option>`).join('');

  /** Oda durumu değişince yeniden çiz; yazılmakta olan metinleri koru */
  function renderOnline(changed) {
    if (App.route !== 'multi') return;
    const keep = {};
    const guessForm = $('[data-form="ol-guess"]');
    ['guess', 'ol-code', 'pname-0'].forEach(id => {
      const el = document.getElementById(id);
      if (el && !el.disabled) keep[id] = { v: el.value, f: document.activeElement === el, s: el.selectionStart, round: guessForm ? guessForm.dataset.index : null };
    });
    render({ noAnim: !changed || Online.inRoom(), keepScroll: !changed });
    Object.keys(keep).forEach(id => {
      const el = document.getElementById(id);
      if (!el || el.disabled) return;
      const k = keep[id];
      if (id === 'guess') {
        const f = $('[data-form="ol-guess"]');
        if (!f || f.dataset.index !== k.round) return;     // yeni tur: eski taslağı taşıma
        el.value = k.v;
        NumberInput.afterChange(el);
      } else {
        el.value = k.v;
      }
      if (k.f) { el.focus({ preventScroll: true }); try { el.setSelectionRange(k.s, k.s); } catch (e) { /* yok say */ } }
    });
  }

  function viewOnline() {
    const O = Online;
    if (!O.role && O.status === 'idle') return viewOnlineEntry();
    if (O.status === 'error' || O.status === 'closed') return viewOnlineNotice();
    if (!O.room || O.status === 'connecting') return viewOnlineConnecting();
    const banner = O.status === 'reconnecting'
      ? `<div class="net-banner" role="status"><span class="spinner sm"></span>Ev sahibiyle bağlantı yeniden kuruluyor… (${O.retry}/${NET.RECONNECT_TRIES})</div>` : '';
    switch (O.room.phase) {
      case 'lobby': return viewOnlineLobby(banner);
      case 'question': return viewOnlineQuestion(banner);
      case 'reveal': return viewOnlineReveal(banner);
      case 'finished': return viewOnlineFinished(banner);
      default: return viewOnlineEntry();
    }
  }

        <div class="notice glass">
          <div class="empty-icon">${icon(closed ? 'flag' : 'alert')}</div>

  function hudHTML(room, banner) {
    const host = Online.isHost();
    const total = room.questionIds.length;
    return `
      ${banner}
      <div class="hud glass">
        <div class="hud-top">
          <span class="hud-mode">${icon('users')}Online · ${escapeHTML(room.code)} · ${escapeHTML(catName(room.category))}</span>
          <button type="button" class="btn btn-danger btn-sm" data-action="ol-leave">${icon('flag')}<span>${host ? 'Odayı Kapat' : 'Ayrıl'}</span></button>

        ${total ? `
        <div class="hud-progress">
          <div class="hud-qno" aria-label="Tur ${Math.min(room.index + 1, total)} / ${total}"><b>${Math.min(room.index + 1, total)}</b><span>/${total}</span></div>
          <div class="progress" aria-hidden="true"><div class="progress-fill" data-progress="${(room.history.length / total).toFixed(4)}"></div></div>
        </div>` : ''}
        ${scoreboardHTML(room)}

  function scoreboardHTML(room) {
    const rows = onlineStandings(room);
    const leaderTotal = Math.max(...rows.map(r => r.total));
    return `<ol class="scoreboard" aria-label="Puan durumu">${rows.slice().sort((a, b) => a.rank - b.rank).map(r => `
      <li class="sb-item ${r.total === leaderTotal && leaderTotal > 0 ? 'is-leader' : ''} ${r.connected ? '' : 'is-off'}" style="--pc:${playerHex(r.color)}">
        <span class="sb-rank">${r.rank}</span>${avatar(r.name, r.color, 'sm')}
        <span class="sb-name">${escapeHTML(r.name)}${r.id === clientId ? ' <small>(sen)</small>' : ''}</span>
        ${r.total === leaderTotal && leaderTotal > 0 ? `<span class="sb-crown" title="Lider">${icon('crown', 'ico-sm')}</span>` : ''}
        <b class="sb-score">${fmtInt(r.total)}</b>
      </li>`).join('')}</ol>`;
  }

  function viewOnlineLobby(banner) {
    const room = Online.room;
    const host = Online.isHost();
    const connected = room.players.filter(p => p.connected).length;
    const slots = [];
    for (let i = 0; i < CONFIG.MP_MAX; i++) {
      const p = room.players[i];
      slots.push(p ? `
        <li class="ol-player ${p.connected ? '' : 'is-off'}" style="--pc:${playerHex(p.color)}">
          ${avatar(p.name, p.color)}
          <span class="ol-player-name">${escapeHTML(p.name)}${p.id === clientId ? ' <small>(sen)</small>' : ''}</span>
          ${p.id === room.hostId ? `<span class="host-badge" title="Ev sahibi">${icon('crown', 'ico-sm')}<span class="sr-only">Ev sahibi</span></span>` : ''}
          <span class="conn-dot" title="${p.connected ? 'Bağlı' : 'Bağlantı yok'}"></span>
        </li>` : `<li class="ol-player is-empty"><span class="avatar empty" aria-hidden="true">+</span><span class="ol-player-name muted">Boş yer</span></li>`);
    }
    return `
      <section class="setup container" aria-labelledby="lobby-title">
        ${banner}

  /** Paylaşım / kopyalama */
  async function copyText(text, okMsg) {
    try {
      if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); Toast.show(okMsg, 'success'); return; }
    } catch (e) { /* yedeğe düş */ }
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    Toast.show(ok ? okMsg : `Kopyalanamadı: ${text}`, ok ? 'success' : 'error', ok ? 3000 : 8000);
  }

    }
    copyText(url, 'Davet bağlantısı kopyalandı.');
  }

  /* ---------------- İstatistikler ---------------- */
  function viewStats() {
    const st = Store.get();
    const s = st.statistics; const u = st.unlimited;
    const total = QuestionRepository.all().length;
    const unseen = Daily.unseenCount();
    const playedDays = Object.values(s.days).filter(d => d.count > 0).length;
    const hasData = s.totalQuestions > 0;

    const catRows = CATEGORIES.map(c => {
      const v = s.categories[c.key];
      const avg = v && v.count ? v.accuracySum / v.count : 0;
      return { label: c.name, iconName: c.icon, value: avg, max: 100, display: v ? fmtPct(avg) : '—', sub: v ? `${v.count} soru` : 'henüz yok' };
    });
    const levelRows = LEVELS.map(l => {
      const n = s.levels[l.key] || 0;
      return { label: l.label, dot: l.color, value: n, max: s.totalQuestions || 1, display: fmtInt(n), sub: s.totalQuestions ? fmtPct((n / s.totalQuestions) * 100) : '', color: l.color };
    });
    const today = TimeService.today();
    const days = [];
    for (let i = 13; i >= 0; i--) {
      const k = TimeService.addDays(today, -i);
      const v = s.days[k];
      days.push({ k, score: v ? v.score : 0, count: v ? v.count : 0, avg: v && v.count ? v.accuracySum / v.count : 0 });
    }
    const maxDay = Math.max(1000, ...days.map(d => d.score));
    const niceMax = Math.ceil(maxDay / 1000) * 1000;
    const dayCols = days.map(d => ({
      value: d.score,
      color: d.score ? 'var(--orange)' : 'rgba(255,255,255,.12)',
      label: TimeService.shortDate(d.k).split(' ')[0],
      tip: `${escapeHTML(TimeService.shortDate(d.k))} · <b>${escapeHTML(fmtInt(d.score))} puan</b><br>${d.count} soru${d.count ? ` · ${escapeHTML(fmtPct(d.avg))}` : ''}`
    }));
    const empty = `
      <div class="empty-state">
        <div class="empty-icon">${icon('chart')}</div>
        <h3>Henüz veri yok</h3>
        <p>İlk tahminini yaptığında grafiklerin burada şekillenmeye başlayacak.</p>
        <button type="button" class="btn btn-primary" data-action="go" data-to="daily"><span class="btn-label">İlk Soruyu Çöz</span>${icon('arrow', 'ico-arrow')}</button>
      </div>`;

    return `
      <section class="stats-page container" aria-labelledby="stats-title">
        <div class="page-head">
          <h1 class="page-title" id="stats-title">İstatistikler</h1>
        </div>
        <div class="stat-grid">
          ${statTile('Toplam Cevap', cu(s.totalQuestions), 'layers')}
          ${statTile('Toplam Puan', cu(s.totalScore), 'bolt', { accent: true })}
          ${statTile('Ortalama Yakınlık', cu(s.averageAccuracy, { decimals: 1, prefix: '%' }), 'target', { accent: true })}
          ${statTile('Tam İsabet', cu(s.exactHits), 'star')}
          ${statTile('En Yüksek Skor', cu(s.bestScore), 'trophy', { foot: 'Tek oyunda / günde' })}
          ${statTile('Sınırsız Rekor', cu(u.bestSessionScore), 'infinity')}
          ${statTile('Oynanan Gün', cu(playedDays), 'calendar')}
          ${statTile('Günlük Seri', `${cu(Stats.streak())}<span class="muted" style="font-size:.55em"> gün</span>`, 'flame')}
        </div>
        <div class="chart-grid">
          <div class="chart-card wide">
            <div class="chart-head"><h2 class="chart-title">Son 14 Gün</h2><span class="chart-sub">Günlük toplam puan (tüm modlar)</span></div>
            ${hasData ? Charts.columns(dayCols, { max: niceMax, ariaLabel: 'Son 14 günün günlük puanları', ticks: [niceMax, niceMax / 2, 0], tickFmt: v => fmtInt(v) }) : empty}
          </div>
          <div class="chart-card">
            <div class="chart-head"><h2 class="chart-title">Kategori Başarısı</h2><span class="chart-sub">Ortalama yakınlık</span></div>
            ${hasData ? Charts.hbars(catRows) : empty}
          </div>
          <div class="chart-card">
            <div class="chart-head"><h2 class="chart-title">Yakınlık Dağılımı</h2><span class="chart-sub">Derecelere göre cevap sayısı</span></div>
            ${hasData ? Charts.hbars(levelRows) : empty}
          </div>
        </div>
        <div class="info-card pool-card">
          <h2>${icon('database')}Günlük soru havuzu</h2>
          <div class="pool-row"><span>Günlük modda henüz görülmemiş soru</span><span><b>${unseen}</b> / ${total}</span></div>
          <div class="progress" aria-hidden="true"><div class="progress-fill" data-progress="${(unseen / Math.max(total, 1)).toFixed(4)}"></div></div>
          <p>Görülen sorular günlük modda tekrar sorulmaz; geçmiş yalnızca bu tarayıcıda saklanır.</p>
        </div>
        <div class="danger-zone">
          <div><h3>Verileri sıfırla</h3><p>Tüm ilerleme, istatistik ve soru geçmişi bu tarayıcıdan kalıcı olarak silinir.</p></div>
          <button type="button" class="btn btn-danger" data-action="reset-data">${icon('reset')}<span>Tüm Verileri Sıfırla</span></button>
        </div>
      </section>`;
  }

  /* ======================================================================
     13. YÖNLENDİRME & OLAY YÖNETİMİ
     ====================================================================== */
  const App = { route: 'home', busy: false, lastCategory: MIXED, lastUnlimitedSummary: null, knownDay: '', celebrate: false };

  const ROUTES = {
    home: { slug: '', render: viewHome, title: 'Ana Sayfa' },
    daily: { slug: 'gunluk', render: viewDaily, title: 'Günlük Oyun' },
    unlimited: { slug: 'sinirsiz', render: viewUnlimited, title: 'Sınırsız Oyun' },
    multi: { slug: 'cok-oyunculu', render: viewOnline, title: 'Çok Oyunculu' },
    howto: { slug: 'nasil-oynanir', render: viewHowTo, title: 'Nasıl Oynanır?' },
    stats: { slug: 'istatistikler', render: viewStats, title: 'İstatistikler' }
  };
  const SLUG_TO_ROUTE = Object.keys(ROUTES).reduce((m, k) => { m[ROUTES[k].slug] = k; return m; }, {});
  const parseHash = () => {
    const slug = (window.location.hash || '').replace(/^#\/?/, '').split(/[?#/]/)[0];
    return SLUG_TO_ROUTE[slug] || 'home';
  };

  function go(route) {
    const r = ROUTES[route] ? route : 'home';
    const hash = '#/' + ROUTES[r].slug;
    if (window.location.hash === hash || (hash === '#/' && !window.location.hash)) {
      changeRoute(r);
    } else {
      window.location.hash = hash;
    }
  }

  function changeRoute(r) {
    if (App.route === 'unlimited' && r !== 'unlimited') App.lastUnlimitedSummary = null;
    App.route = r;
    render({ focus: true });
  }

  function render({ noAnim = false, focus = false, keepScroll = false } = {}) {
    const main = $('#app');
    if (!main) return;
    const route = ROUTES[App.route] || ROUTES.home;
    let html;
    try {
      html = route.render();
    } catch (err) {
      console.error(err);
      html = fatalHTML();
    }
    main.innerHTML = `<div class="${noAnim ? '' : 'view-enter'}">${html}</div>`;
    document.title = `${route.title} · Adivinar`;
    updateNav();
    if (!keepScroll) window.scrollTo(0, 0);
    afterRender(focus);
  }

  /** Her görünüm sonrası: animasyonlar, soru kullanım kaydı, odak */
  function afterRender(focus) {
    const main = $('#app');
    animateMeters(main);
    Charts.animateIn(main);

    if (App.route === 'multi') {
      const g = $('[data-form="ol-guess"] #guess', main);
      if (g && !g.disabled && finePointer() && (document.activeElement === document.body || document.activeElement === main)) g.focus({ preventScroll: true });
      Online.tryAutoRejoin();
    }
    const form = $('[data-form="answer"]', main);
    if (form) {
      const mode = form.dataset.mode;
      const qid = form.dataset.qid;
      if (mode === 'daily') Daily.markShown(qid);   // Gösterildiği anda kullanıldı
      const rec = mode === 'daily' ? Daily.currentAnswer() : Unlimited.currentAnswer();
      if (rec) {
        animateResult(rec, { focus: true });
      } else {
        runCountUps(main);
        const input = $('#guess', form);
        if (input && finePointer()) input.focus({ preventScroll: true });
        else if (focus) main.focus({ preventScroll: true });
      }
      runCountUps(main);
    } else {
      runCountUps(main);
      if (focus) main.focus({ preventScroll: true });
    }

    if (App.celebrate) {
      App.celebrate = false;
      Confetti.fire(1);
    }
  }

  function updateNav() {
    $$('[data-nav]').forEach(a => {
      const active = a.dataset.nav === App.route;
      a.classList.toggle('is-active', active);
      if (active) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    setMenu(false);
  }

  function setMenu(open) {
    const header = $('#topbar');
    const btn = $('.menu-toggle');
    if (!header || !btn) return;
    header.classList.toggle('nav-open', open);
    btn.setAttribute('aria-expanded', String(open));
    const label = $('.sr-only', btn); if (label) label.textContent = open ? 'Menüyü kapat' : 'Menüyü aç';
  }

  /* --- Cevap gönderimi --- */
  async function handleAnswerSubmit(form) {
    if (App.busy) return;
    const mode = form.dataset.mode;
    const input = $('#guess', form);
    if (!input || input.disabled) return;
    const q = mode === 'daily' ? Daily.current() : Unlimited.current();
    // Gün değiştiyse veya soru değiştiyse yanlış soruya cevap yazılmasını engelle
    if (!q || q.id !== form.dataset.qid) {
      Toast.show('Soru güncellendi. Lütfen yeni soruya tahmin gir.', 'info');
      render({ noAnim: true });
      return;
    }
    const parsed = NumberInput.parse(input.value, q.year);
    if (!parsed.ok) { NumberInput.showError(input, parsed.message); return; }

    App.busy = true;
    const btn = $('[data-submit]', form);
    if (btn) { btn.classList.add('is-loading'); btn.disabled = true; btn.setAttribute('aria-busy', 'true'); }
    input.readOnly = true;
    await wait(prefersReducedMotion() ? 0 : CONFIG.SUBMIT_DELAY_MS);

    let rec = null;
    try {
      rec = mode === 'daily' ? Daily.submit(parsed.value) : Unlimited.submit(parsed.value);
    } catch (err) {
      console.error(err);
      Toast.show('Cevap kaydedilirken bir hata oluştu.', 'error');
    }
    App.busy = false;
    if (!rec) { render({ noAnim: true, keepScroll: true }); return; }

    // Cevabı kilitle ve sonucu göster
    input.readOnly = false;
    input.disabled = true;
    input.removeAttribute('aria-invalid');
    input.value = NumberInput.toInputString(parsed.value, q.year);
    form.classList.add('is-locked');
    if (btn) btn.remove();
    const hint = $('#guess-hint'); if (hint) hint.textContent = '';
    const d = Store.get().daily;
    const ctx = mode === 'daily'
      ? { mode, last: d.currentIndex === d.questions.length - 1 }
      : { mode };
    $('#result-slot').innerHTML = resultHTML(q, rec, ctx);
    if (mode === 'daily') updateDailyHUD(); else updateUnlimitedHUD();
    animateResult(rec);
  }

  async function leaveCard() {
    const card = $('#qcard');
    if (!card || prefersReducedMotion()) return;
    card.classList.add('is-leaving');
    await wait(230);
  }

  async function handleDailyNext() {
    if (App.busy) return;
    if (!Daily.currentAnswer()) {
      Toast.show('Sonraki soruya geçmek için önce cevap vermelisin.', 'error');
      return;
    }
    App.busy = true;
    await leaveCard();
    Daily.next();
    App.busy = false;
    if (Daily.status() === 'complete') {
      const avg = Daily.avgAccuracy();
      App.celebrate = avg >= 60;
      render();
      Toast.show('Tebrikler! Bugünün meydan okumasını tamamladın.', 'success');
    } else {
      render({ noAnim: true });
    }
  }

  async function handleUnlimitedNext() {
    if (App.busy) return;
    App.busy = true;
    const s = Unlimited.session();
    if (!s || !s.answered) {
      App.busy = false;
      Toast.show('Sonraki soruya geçmek için önce cevap vermelisin.', 'error');
      return;
    }
    await leaveCard();
    const r = Unlimited.next();
    App.busy = false;
    if (r.ok) {
      if (r.recycled) Toast.show('Bu kategorideki tüm soruları daha önce gördün; sorular yeniden karıştırıldı.', 'info', 4500);
      render({ noAnim: true });
    } else if (r.reason === 'exhausted') {
      Toast.show('Bu kategorideki tüm soruları bu oyunda cevapladın!', 'success', 4500);
      finishUnlimited();
    } else {
      render({ noAnim: true });
    }
  }

  function finishUnlimited() {
    const sum = Unlimited.finish();
    if (sum && sum.count) {
      App.lastUnlimitedSummary = sum;
      App.celebrate = sum.newRecord || sum.avg >= 80;
      if (sum.newRecord) Toast.show(`Yeni kişisel rekor: ${fmtInt(sum.total)} puan!`, 'success', 4500);
    } else {
      Toast.show('Cevaplanan soru olmadığı için oyun rapor oluşturulmadan sonlandırıldı.', 'info');
    }
    render();
  }

  function confirmFinish() {
    const s = Unlimited.session();
    if (!s) { render(); return; }
    Modal.open({
      title: 'Oyunu bitirmek istiyor musun?',
      body: s.answers.length
        ? `Bu oyunda ${s.answers.length} soru cevapladın ve ${fmtInt(s.score)} puan topladın. Performans raporun hazırlanacak.`
        : 'Henüz hiç soru cevaplamadın. Oyun rapor oluşturulmadan sonlandırılacak.',
      confirmText: 'Oyunu Bitir',
      cancelText: 'Devam Et',
      iconName: 'flag',
      onConfirm: finishUnlimited
    });
  }

  function confirmReset() {
    Modal.open({
      title: 'Tüm veriler silinsin mi?',
      body: 'Günlük ilerleme, sınırsız mod rekorları, istatistikler ve soru geçmişi kalıcı olarak silinecek. Bu işlem geri alınamaz.',
      confirmText: 'Evet, Sıfırla',
      cancelText: 'Vazgeç',
      danger: true,
      iconName: 'alert',
      onConfirm: () => {
        Store.reset();
        App.lastUnlimitedSummary = null;
        Toast.show('Tüm veriler sıfırlandı.', 'success');
        render();
      }
    });
  }

  /* --- Online işleyiciler --- */
  function saveProfileFromForm() {
    const inp = $('#pname-0');
    const mp = Store.get().multiplayer;
    if (inp) mp.roster[0].name = cleanName(inp.value);
    Store.save();
  }

  function setMyColor(color) {
    const mp = Store.get().multiplayer;
    if (!PLAYER_COLOR_MAP.has(color)) return;
    const other = mp.roster.findIndex((p, i) => i !== 0 && p.color === color);
    if (other !== -1) mp.roster[other].color = mp.roster[0].color;
    mp.roster[0].color = color;
    Store.save();
    renderOnline(false);
  }

  async function handleOnlineGuess(form) {
    if (App.busy) return;
    const room = Online.room;
    const input = $('#guess', form);
    if (!room || room.phase !== 'question' || !input || input.disabled || String(room.index) !== form.dataset.index) return;
    const q = QuestionRepository.get(form.dataset.qid);
    if (!q) return;
    const parsed = NumberInput.parse(input.value, q.year);
    if (!parsed.ok) { NumberInput.showError(input, parsed.message); return; }
    App.busy = true;
    const btn = $('[data-submit]', form);
    if (btn) { btn.classList.add('is-loading'); btn.disabled = true; }
    await wait(prefersReducedMotion() ? 0 : 250);
    App.busy = false;
    if (!Online.submitGuess(parsed.value)) renderOnline(false);
  }

  function confirmLeave() {
    const host = Online.isHost();
    const others = Online.room ? Online.room.players.filter(p => p.id !== clientId && p.connected).length : 0;
    if (!Online.room || (!host && Online.room.phase === 'lobby') || (host && !others)) { Online.leave(); return; }
    Modal.open({
      title: host ? 'Oda kapatılsın mı?' : 'Odadan ayrılmak istiyor musun?',
      body: host ? 'Oda kapanınca tüm oyuncuların bağlantısı kesilir ve maç sona erer.' : 'Maç devam ederken ayrılırsan kalan turlarda puan alamazsın.',
      confirmText: host ? 'Odayı Kapat' : 'Ayrıl',
      cancelText: 'Vazgeç',
      danger: true,
      iconName: 'flag',
      onConfirm: () => Online.leave()
    });
  }

  /* --- Olay delegasyonu: tüm tıklamalar tek dinleyicide --- */
  function onClick(e) {
    const el = e.target.closest('[data-action]');
    if (!el) {
      const header = $('#topbar');
      if (header && header.classList.contains('nav-open') && !e.target.closest('#topbar')) setMenu(false);
      return;
    }
    const action = el.dataset.action;
    switch (action) {
      case 'go': e.preventDefault(); go(el.dataset.to); break;
      case 'menu-toggle': setMenu(!$('#topbar').classList.contains('nav-open')); break;
      case 'daily-next': handleDailyNext(); break;
      case 'unl-next': handleUnlimitedNext(); break;
      case 'unl-finish': confirmFinish(); break;
      case 'unl-new': App.lastUnlimitedSummary = null; render(); break;
      case 'reset-data': confirmReset(); break;
      case 'reload': window.location.reload(); break;
      case 'ol-color': setMyColor(el.dataset.color); break;
      case 'ol-reopen': Online.create(true); break;
      case 'ol-discard': StorageAdapter.remove(NET.HOST_KEY); render({ noAnim: true, keepScroll: true }); break;
      case 'ol-cancel': Online.leave(); break;
      case 'ol-retry': Online.join(Online.code); break;
      case 'ol-copy-code': if (Online.room) copyText(Online.room.code, 'Oda kodu kopyalandı.'); break;
      case 'ol-share': shareInvite(); break;
      case 'ol-start': Online.startMatch(); break;
      case 'ol-skip': Online.skipWaiting(); break;
      case 'ol-next': Online.nextRound(); break;
      case 'ol-rematch': Online.startMatch(); break;
      case 'ol-lobby': Online.backToLobby(); break;
      case 'ol-leave': confirmLeave(); break;
      default: break;
    }
  }

  function onSubmit(e) {
    const form = e.target;
    if (form.matches('[data-form="answer"]')) {
      e.preventDefault();
      handleAnswerSubmit(form);
    } else if (form.matches('[data-form="ol-create"]')) {
      e.preventDefault();
      saveProfileFromForm();
      Online.create(false);
    } else if (form.matches('[data-form="ol-join"]')) {
      e.preventDefault();
      saveProfileFromForm();
      const code = $('#ol-code', form);
      Online.join(code ? code.value : '');
    } else if (form.matches('[data-form="ol-guess"]')) {
      e.preventDefault();
      handleOnlineGuess(form);
    } else if (form.matches('[data-form="ol-settings"]')) {
      e.preventDefault();
    } else if (form.matches('[data-form="unl-setup"]')) {
      e.preventDefault();
      const checked = $('input[name="category"]:checked', form);
      const cat = checked ? checked.value : MIXED;
      if (cat !== MIXED && !CAT_MAP.has(cat)) return;
      App.lastCategory = cat;
      App.lastUnlimitedSummary = null;
      const ok = Unlimited.start(cat);
      if (!ok || !ok.ok) { Toast.show('Bu kategoride soru bulunamadı.', 'error'); return; }
      if (ok.recycled) Toast.show('Bu kategorideki tüm soruları daha önce gördün; sorular yeniden karıştırıldı.', 'info', 4500);
      render();
    }
  }

  function onInput(e) {
    const t = e.target;
    if (!t || !t.classList) return;
    if (t.classList.contains('guess-input')) NumberInput.onInput(e);
    else if (t.id === 'ol-code') {
      const v = t.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, NET.CODE_LENGTH);
      if (v !== t.value) t.value = v;
    }
    else if (t.classList.contains('mp-name')) {
      const i = Number(t.dataset.index);
      const mp = Store.get().multiplayer;
      if (!mp.roster[i]) return;
      mp.roster[i].name = cleanName(t.value);
      const av = $(`[data-avatar="${i}"]`);
      if (av) av.innerHTML = initial(mp.roster[i].name || `Oyuncu ${i + 1}`);
    }
  }

  /** Online kurulum ve lobi ayarları */
  function onChange(e) {
    const t = e.target;
    if (!t || !t.name && !t.classList) return;
    const mp = Store.get().multiplayer;
    if (t.name === 'ol-rounds' && CONFIG.MP_ROUND_OPTIONS.includes(Number(t.value))) { mp.settings.rounds = Number(t.value); Store.save(); }
    else if (t.name === 'ol-category' && (t.value === MIXED || CAT_MAP.has(t.value))) { mp.settings.category = t.value; Store.save(); }
    else if (t.name === 'ol-room-rounds') Online.updateSettings({ rounds: Number(t.value) });
    else if (t.name === 'ol-room-category') Online.updateSettings({ category: t.value });
    else if (t.classList && t.classList.contains('mp-name')) { t.value = cleanName(t.value); mp.roster[0].name = t.value; Store.save(); }
  }

  function onKeydown(e) {
    if (e.key === 'Escape') {
      const header = $('#topbar');
      if (header && header.classList.contains('nav-open')) { setMenu(false); $('.menu-toggle').focus(); }
    }
  }

  /** Gün değişimi denetimi (İstanbul saati) */
  function checkDayChange() {
    const t = TimeService.today();
    if (t === App.knownDay) return;
    App.knownDay = t;
    if (App.busy || Modal.isOpen()) return;
    Toast.show('Yeni gün başladı! Günlük meydan okuma yenilendi.', 'success', 5000);
    if (App.route === 'daily' || App.route === 'home' || App.route === 'stats') render({ noAnim: true });
  }

  function tick() {
    const el = $('[data-countdown]');
    if (el) el.textContent = TimeService.countdown(TimeService.msUntilMidnight());
  }

  function fatalHTML() {
    return `
      <section class="container fatal">
        <div class="notice glass">
          <div class="empty-icon">${icon('alert')}</div>
          <h1>Bir şeyler ters gitti</h1>
          <p>Ekran yüklenirken beklenmeyen bir hata oluştu. Sayfayı yenilemeyi dene; sorun devam ederse verileri sıfırlayabilirsin.</p>
          <div class="summary-actions">
            <button type="button" class="btn btn-primary" data-action="reload"><span class="btn-label">Sayfayı Yenile</span></button>
            <button type="button" class="btn btn-danger" data-action="reset-data">${icon('reset')}<span>Verileri Sıfırla</span></button>
          </div>
        </div>
      </section>`;
  }

  /* ======================================================================
     14. BAŞLATMA
     ====================================================================== */
  function hideBoot() {
    const boot = $('#boot');
    if (!boot) return;
    boot.classList.add('is-hidden');
    setTimeout(() => boot.remove(), 600);
  }

  function init() {
    try {
      Store.load();
      App.knownDay = TimeService.today();
      App.route = parseHash();

      document.addEventListener('click', onClick);
      document.addEventListener('submit', onSubmit);
      document.addEventListener('input', onInput);
      document.addEventListener('change', onChange);
      // Host sekmeyi kapatmak üzereyse uyar (oda kaydı sayesinde yeniden açılabilir)
      window.addEventListener('beforeunload', e => {
        if (Online.isHost() && Online.conns.size > 0) { e.preventDefault(); e.returnValue = ''; }
      });
      document.addEventListener('keydown', onKeydown);
      window.addEventListener('hashchange', () => {
        const r = parseHash();
        if (r !== App.route) changeRoute(r); else render({ noAnim: true });
      });
      // Başka sekmede yapılan değişiklikleri al
      window.addEventListener('storage', e => {
        if (e.key !== CONFIG.STORAGE_KEY || App.busy) return;
        Store.load();
        render({ noAnim: true, keepScroll: true });
      });
      document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDayChange(); });
      setInterval(checkDayChange, 30000);
      setInterval(tick, 1000);

      render({ noAnim: false });
      setTimeout(hideBoot, 250);

      if (!StorageAdapter.available()) {
        Toast.show('Tarayıcı depolaması kullanılamıyor; ilerlemen kaydedilmeyecek.', 'error', 6500);
      } else if (Store.meta.corrupted) {
        Toast.show('Kayıtlı veriler okunamadı; güvenli varsayılanlarla devam ediliyor.', 'error', 6000);
      }
    } catch (err) {
      console.error('[Adivinar] Başlatma hatası:', err);
      const main = $('#app');
      if (main) main.innerHTML = fatalHTML();
      hideBoot();
    }
  }

  // Test/hata ayıklama için salt okunur kanca (oyun durumunu değiştirmez)
  Object.defineProperty(window, '__ADIVINAR__', {
    value: Object.freeze({ version: CONFIG.DATA_VERSION, questionCount: () => QuestionRepository.all().length }),
    configurable: false
  });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

  </script>
</body>
</html>
